      { q: "What is S3 and what are its storage classes?", a: "Object storage service — unlimited capacity, 11 nines durability.\n\n🔧 Real-time Example:\nS3 lifecycle policy for application logs:\n\nDay 0-30:   S3 Standard        $0.023/GB  active debugging\nDay 30-90:  Standard-IA        $0.0125/GB occasional access\nDay 90-365: Glacier Instant    $0.004/GB  compliance queries\nDay 365+:   Deep Archive       $0.00099/GB legal retention\n\napiVersion in S3 lifecycle rule:\n{\n  Rules: [{\n    Transitions: [\n      {Days: 30,  StorageClass: STANDARD_IA},\n      {Days: 90,  StorageClass: GLACIER_IR},\n      {Days: 365, StorageClass: DEEP_ARCHIVE}\n    ],\n    Expiration: {Days: 2555}  # 7 years total\n  }]\n}\n\nResult: 10TB of logs\nStandard cost:      $230/month\nWith lifecycle:      $15/month (after aging)\nSaving:              $215/month = $2,580/year!" },
      { q: "What is the difference between EC2, ECS, and EKS?", a: "EC2: Virtual machines (full control, most work)\nECS: AWS-managed container orchestration (simpler)\nEKS: Managed Kubernetes (portable, powerful)\n\n🔧 Real-time Example:\nChoosing compute for different scenarios:\n\nEC2: Legacy Java monolith that can't be containerized\n  → Install Java + app directly on VM\n  → You manage OS patches, scaling, HA\n  → Most control, most work\n\nECS: Simple containerized app, small team\n  → Team not familiar with Kubernetes\n  → Less complexity than EKS\n  → Tightly integrated with AWS services\n  → Good for: startups, simple microservices\n\nEKS: Complex microservices platform, 50+ services\n  → Need: HPA, custom operators, service mesh\n  → Multi-cloud strategy (same K8s YAML on AWS/GCP)\n  → Large team with K8s expertise\n  → Industry standard — your team can hire K8s engineers" },
      { q: "How does cross-account access work in AWS?", a: "Account A assumes a role defined in Account B to access its resources.\n\n🔧 Real-time Example: CI/CD deploying to prod account\n\nIn PROD account B:\n1. Create IAM Role 'DeployRole'\n2. Trust Policy: allow dev account A to assume\n   {Principal: {AWS: 'arn:aws:iam::DEV_ACCOUNT:root'}}\n3. Permission Policy: EKS deploy, ECR pull\n\nIn DEV account A (Jenkins):\n4. Allow Jenkins role to sts:AssumeRole\n\nJenkins pipeline:\nCREDS=$(aws sts assume-role \\\n  --role-arn arn:aws:iam::PROD:role/DeployRole \\\n  --role-session-name jenkins-deploy)\n\nexport AWS_ACCESS_KEY_ID=$(echo $CREDS | jq .Credentials.AccessKeyId)\nexport AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq .Credentials.SecretAccessKey)\nexport AWS_SESSION_TOKEN=$(echo $CREDS | jq .Credentials.SessionToken)\n\nkubectl apply -f k8s/ -n production  # deploys to PROD\n# Credentials expire in 1 hour automatically!" },
      { q: "What is CloudWatch and how do you use it for monitoring?", a: "AWS native monitoring service for metrics, logs, alarms, and dashboards.\n\n🔧 Real-time Example:\n# EC2 CPU alarm\naws cloudwatch put-metric-alarm \\\n  --alarm-name 'High-CPU-Alert' \\\n  --metric-name CPUUtilization \\\n  --namespace AWS/EC2 \\\n  --dimensions Name=InstanceId,Value=i-1234 \\\n  --period 300 \\\n  --evaluation-periods 2 \\\n  --threshold 80 \\\n  --comparison-operator GreaterThanThreshold \\\n  --alarm-actions arn:aws:sns:us-east-1:123:AlertTopic\n\n# Application logs to CloudWatch\n# In app code:\nlogger.error('Payment failed: {}', error)\n# CloudWatch Logs Agent ships to /aws/myapp/logs\n\n# CloudWatch Logs Insights query:\nfields @timestamp, @message\n| filter @message like /ERROR/\n| sort @timestamp desc\n| limit 20\n\n# Results: 47 payment errors in last hour, all from IP 10.0.3.45" },
    ]
  },

      { q: "How do you check disk space and troubleshoot disk issues?", a: "Use df for filesystem usage, du for directory sizes.\n\n🔧 Real-time Example: Jenkins server disk 99% full!\ndf -h\n# /dev/xvda1  50G  49.5G  0.5G  99%  /  ← critical!\n\n# Find what's eating space\ndu -sh /* 2>/dev/null | sort -rh | head -10\n# 35G /var\n# 30G /var/lib/docker\n\n# Docker taking 30GB!\ndocker system df\n# Images: 18G  Containers: 8G  Volumes: 4G\n\ndocker system prune -af --volumes\n# Freed 25GB!\n\ndf -h\n# 75% used → breathing room!\n\n# Permanent fix:\n# Configure Docker log rotation:\nvi /etc/docker/daemon.json\n# {\"log-driver\":\"json-file\",\"log-opts\":{\"max-size\":\"10m\",\"max-file\":\"3\"}}\n\n# Cron job for weekly cleanup:\n0 2 * * 0 docker system prune -af > /var/log/docker-cleanup.log 2>&1" },
      { q: "How do you troubleshoot a slow server?", a: "Systematic performance debugging:\n\n🔧 Real-time Example: App responding slowly.\n\n# Step 1: Load average\nuptime\n# load average: 15.2, 12.1, 9.3 ← high on 4-core server!\n\n# Step 2: CPU\ntop\n# PID  USER  %CPU  COMMAND\n# 5432 java  380%  java -jar app.jar  ← multiple cores!\n\n# Step 3: Memory\nfree -h\n# Mem: 16G used: 15.8G available: 0.2G  ← almost OOM!\n# si/so in vmstat? (swap activity)\nvmstat 1 | tail -5\n# si: 245 so: 312 ← heavy swap activity!\n\n# Step 4: Disk I/O\niostat -x 1\n# xvda: %util 95%  ← disk bottleneck!\n\niotop\n# PID  DISK WRITE  COMMAND\n# 5432  200MB/s     java  ← Java writing huge logs!\n\n# Fix: reduce log level from DEBUG to WARN in production" },
      { q: "How do you manage file permissions in Linux?", a: "chmod (permissions) and chown (ownership).\n\n🔧 Real-time Example:\n# Check permissions\nls -la /app\n# -rw-r--r-- 1 root root  config.yml  ← only root can read!\n# drwxr-xr-x 2 root root  logs/\n\n# Fix: Give app user access\nchown -R appuser:appgroup /app\nchmod 640 /app/config.yml     # owner rw, group r, others none\nchmod 750 /app/              # owner rwx, group rx, others none\n\n# Numeric permissions:\n# 7 = rwx  6 = rw-  5 = r-x  4 = r--  0 = ---\n# 755 = rwxr-xr-x (scripts/dirs)\n# 644 = rw-r--r-- (regular files)\n# 600 = rw------- (private keys!)\n# 777 = rwxrwxrwx (NEVER in production!)\n\n# Private key permissions (SSH won't work otherwise):\nchmod 600 ~/.ssh/id_rsa\nchmod 644 ~/.ssh/id_rsa.pub\nchmod 700 ~/.ssh/" },
      { q: "How do you troubleshoot SSH connection issues?", a: "Systematic diagnosis from client to server:\n\n🔧 Real-time Example: Cannot SSH after security hardening.\n\n# Step 1: Network connectivity\nping server-ip     # works\nnc -zv server-ip 22  # connection refused!\n\n# Step 2: Verbose SSH\nssh -vvv user@server\n# debug1: connect to address port 22: Connection refused\n\n# Step 3: Check from AWS Console\n# EC2 → Actions → Get system log\n# Found: sshd service failed to start!\n\n# Step 4: Via SSM Session Manager (no SSH needed)\naws ssm start-session --target i-1234567890\n# Connected without SSH!\n\nsystemctl status sshd\n# Active: failed\njournalctl -u sshd\n# 'sshd: /etc/ssh/sshd_config line 45: Bad configuration option'\n\nvi /etc/ssh/sshd_config\n# Found: typo in AllowUsers line\nsystemctl restart sshd\n# SSH working again ✓\n\n# Prevention: Always use SSM Session Manager\n# No open port 22 needed = more secure!" },
      { q: "How do you check and manage processes in Linux?", a: "ps, top, htop, kill — process inspection and management.\n\n🔧 Real-time Example: Port 8080 already in use when starting app.\n\n# Find what's using port 8080\nss -tlnp | grep 8080\n# tcp LISTEN  *:8080  users:((\"java\",pid=5432))\n\n# Or by process name\nps aux | grep java\n# appuser 5432  15.0 25.0  java -jar old-app.jar\n\n# Check process details\nps aux --pid 5432\nls -la /proc/5432/exe  # what binary is it?\n\n# Graceful stop first\nkill -15 5432   # SIGTERM — app can cleanup\nsleep 5\n\n# Check if stopped\nps aux | grep 5432\n\n# Force kill if still running\nkill -9 5432   # SIGKILL — immediate\n\n# Kill by port\nfuser -k 8080/tcp\n\n# Find zombie processes\nps aux | awk '$8==\"Z\" {print $2, $11}'\n# 6789 [python] <defunct>\n# Kill parent to clean up zombies" },
      { q: "What is a shell script and how do you write one?", a: "Automated sequence of shell commands saved as a file.\n\n🔧 Real-time Example: Deployment script.\n#!/bin/bash\nset -euo pipefail  # exit on error, undefined var, pipe failure\n\nAPP_NAME='myapp'\nVERSION=${1:-latest}  # first arg or 'latest' default\nNAMESPACE='production'\n\nif [ -z '$VERSION' ]; then\n  echo 'Usage: ./deploy.sh <version>'\n  exit 1\nfi\n\necho '=== Deploying $APP_NAME:$VERSION ==='\n\n# Build\ndocker build -t $APP_NAME:$VERSION .\n\n# Push\ndocker push myrepo/$APP_NAME:$VERSION\n\n# Deploy\nkubectl set image deployment/$APP_NAME \\\n  app=myrepo/$APP_NAME:$VERSION -n $NAMESPACE\n\n# Wait for rollout\nkubectl rollout status deployment/$APP_NAME \\\n  -n $NAMESPACE --timeout=300s\n\necho '=== Deployment successful! ==='\n\n# Usage: ./deploy.sh v2.1.0\n\nset -e: stops on ANY error\nset -u: stops on undefined variable\nset -o pipefail: catches errors in pipes like 'cmd1 | cmd2'" },
      { q: "How do you schedule tasks with crontab?", a: "crontab defines scheduled commands using time-based triggers.\n\n🔧 Real-time Example:\ncrontab -e  # edit current user's crontab\n\n# Format: minute hour day month weekday command\n# *       *    *   *     *        command\n\n# Common schedules:\n0 2 * * *   /scripts/backup.sh         # daily at 2AM\n0 */4 * * * /scripts/cleanup.sh        # every 4 hours\n30 8 * * 1  /scripts/weekly-report.sh  # Monday 8:30AM\n0 0 1 * *   /scripts/monthly-bill.sh   # 1st of month midnight\n\n# Always redirect output for debugging:\n0 2 * * * /scripts/backup.sh >> /var/log/backup.log 2>&1\n\n# Debug failing cron:\ngrep CRON /var/log/syslog | tail -20\n\n# Common cron issue: PATH is minimal!\n# Wrong:  aws s3 cp file s3://bucket/\n# Right:  /usr/local/bin/aws s3 cp file s3://bucket/\n# Or add: PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin at top" },
    ]

  {
    id: 'sonarqube',
    name: 'Nexus & SonarQube',
    emoji: '🛠️',
    color: '#a855f7',
    questions: [
      { q: "What is SonarQube and what does it analyze?", a: "Platform for continuous code quality inspection via static analysis.\n\nDetects:\n• Bugs — code likely to cause errors\n• Vulnerabilities — security issues\n• Code Smells — maintainability issues\n• Security Hotspots — need security review\n• Duplications — copy-pasted code\n• Coverage — how much code is tested\n\n🔧 Real-time Example:\nDeveloper writes:\nquery = 'SELECT * FROM users WHERE id = ' + userId;\n// SQL Injection vulnerability!\n\nSonarQube detects:\n🔴 VULNERABILITY: SQL Injection (Critical)\nFile: UserRepository.java, Line 45\nFix: Use PreparedStatement\n  query = 'SELECT * FROM users WHERE id = ?';\n  prepStmt.setInt(1, userId);\n\nQuality Gate: FAILED\nJenkins Pipeline: ABORTED\nCode never reaches production ✓\nCost of finding in prod: $0. Cost of finding in prod: $10,000+" },
      { q: "What is a Quality Gate and how do you configure it?", a: "Pass/fail threshold that code must meet before pipeline continues.\n\n🔧 Real-time Example:\n# Create custom Quality Gate in SonarQube UI:\nAdministration → Quality Gates → Create\nName: 'Company Production Standard'\n\nConditions:\n  Coverage on New Code ≥ 75%       (if < 75% → FAIL)\n  Duplicated Lines on New Code < 5% (if > 5% → FAIL)\n  Maintainability Rating = A        (if B,C,D,E → FAIL)\n  Reliability Rating = A\n  Security Rating = A\n  No new Blocker issues\n  No new Critical issues\n\nAssign to project: myapp → Use this gate\n\n# In Jenkins:\nstage('Quality Gate') {\n  steps {\n    timeout(time: 5, unit: 'MINUTES') {\n      waitForQualityGate abortPipeline: true\n    }\n  }\n}\n\nResult: Developer adds feature without tests\nCoverage drops to 60% → Gate FAILS → Pipeline stops\nDeveloper must write tests before merge ✓" },
      { q: "What is Nexus and what types of repositories does it support?", a: "Binary artifact repository manager. Stores and distributes build artifacts.\n\nRepository Types:\n• Hosted: Your own artifacts (JAR, WAR, Docker images)\n• Proxy: Caches remote repos (Maven Central, npm)\n• Group: Combines proxy + hosted into one URL\n\n🔧 Real-time Example:\n# Configure in pom.xml — single Group URL:\n<repositories>\n  <repository>\n    <id>nexus</id>\n    <url>http://nexus:8081/repository/maven-group/</url>\n  </repository>\n</repositories>\n\n# Developer runs: mvn package\n# pom.xml needs spring-boot-starter-web:3.1.0\n\n# Nexus Group resolves:\n1. Check hosted repo → not found\n2. Check proxy repo (caches Maven Central) → found!\n3. Returns artifact to developer\n4. Caches for next request\n\nBenefits:\n✓ Faster builds (local cache, no internet dependency)\n✓ Reproducible builds (artifact never disappears)\n✓ Security scanning before artifacts used\n✓ License compliance" },
      { q: "What is Trivy and how do you use it in CI/CD?", a: "Open-source vulnerability scanner for containers, filesystems, and Git repos.\n\n🔧 Real-time Example:\n# In Jenkins pipeline after Docker build:\nstage('Security Scan - Trivy') {\n  steps {\n    sh '''\n      trivy image \\\n        --exit-code 1 \\\n        --severity CRITICAL,HIGH \\\n        --format table \\\n        --output trivy-report.txt \\\n        myapp:${BUILD_NUMBER}\n    '''\n  }\n  post {\n    always {\n      archiveArtifacts artifacts: 'trivy-report.txt'\n    }\n  }\n}\n\n# Trivy output:\nmyapp:2.1.0 (ubuntu 22.04)\n==============================\nTotal: 2 (CRITICAL: 1, HIGH: 1)\n\n┌─────────┬──────────┬──────────┬─────────────┐\n│ Library │   CVE    │ Severity │ Fix Version │\n├─────────┼──────────┼──────────┼─────────────┤\n│ openssl │CVE-2023  │ CRITICAL │ 3.0.8-1     │\n│ libssl  │CVE-2023  │ HIGH     │ 3.0.8-1     │\n└─────────┴──────────┴──────────┴─────────────┘\n\n# --exit-code 1 → pipeline FAILS on CRITICAL/HIGH\n# Fix: Update base image → apt-get upgrade openssl" },
      { q: "How do you manage secrets securely in CI/CD?", a: "Never hardcode — use dedicated secret management tools.\n\n🔧 Real-time Example: Complete strategy\n\nJenkins Pipeline:\nwithCredentials([\n  usernamePassword(\n    credentialsId: 'nexus-deploy-creds',\n    usernameVariable: 'NEXUS_USER',\n    passwordVariable: 'NEXUS_PASS'\n  )\n]) {\n  sh 'mvn deploy -Dnexus.user=$NEXUS_USER -Dnexus.pass=$NEXUS_PASS'\n}\n# Password never visible in logs!\n\nKubernetes:\n# AWS Secrets Manager → K8s Secret via External Secrets Operator\napiVersion: external-secrets.io/v1beta1\nkind: ExternalSecret\nspec:\n  target:\n    name: db-secret\n  data:\n    - secretKey: password\n      remoteRef:\n        key: prod/myapp/db\n        property: password\n\nApplication:\n# Read from mounted secret file (not env var)\nDB_PASS=$(cat /var/secrets/db/password)\n\nRules:\n❌ Never: ENV DB_PASS=secret123 in Dockerfile\n❌ Never: db_password = \"secret\" in git\n✅ Always: Inject secrets at runtime\n✅ Always: Rotate secrets regularly\n✅ Always: Audit secret access" },
    ]
  },

      { q: "Explain Azure CI/CD pipeline.", a: "Azure Pipelines defines CI/CD workflows in azure-pipelines.yml stored in the repo.\n\n🔧 Real-time Example:\ntrigger:\n  branches:\n    include: [main, develop]\n\nstages:\n  - stage: Build\n    jobs:\n      - job: BuildAndTest\n        pool:\n          vmImage: 'ubuntu-latest'\n        steps:\n          - task: Maven@3\n            inputs:\n              goals: 'clean package'\n              publishJUnitResults: true\n          - task: Docker@2\n            inputs:\n              command: 'buildAndPush'\n              containerRegistry: 'ACR-ServiceConnection'\n              repository: 'myapp'\n              tags: '$(Build.BuildId)'\n\n  - stage: DeployProd\n    dependsOn: Build\n    jobs:\n      - deployment: Production\n        environment: 'production'  # has approval gate\n        strategy:\n          runOnce:\n            deploy:\n              steps:\n                - task: KubernetesManifest@0\n                  inputs:\n                    action: 'deploy'\n                    namespace: 'production'\n                    containers: 'myacr.azurecr.io/myapp:$(Build.BuildId)'" },
      { q: "What is the difference between Microsoft-hosted and self-hosted agents?", a: "Microsoft-hosted: Zero setup, fresh VM each run, full internet, limited private access\nSelf-hosted: Manual setup, faster (pre-warmed), private network access\n\n🔧 Real-time Example:\n# Microsoft-hosted — good for most builds\npool:\n  vmImage: 'ubuntu-latest'  # fresh Ubuntu, tools pre-installed\n  # Includes: Docker, Java, Node, Python, .NET, kubectl\n  # Free: 2000 minutes/month\n\n# Self-hosted — needed for internal resources\npool:\n  name: 'Internal-EC2-Agents'\n  demands:\n    - docker\n    - maven\n# Your EC2 agents can:\n# → Access private Nexus: http://nexus.internal:8081\n# → Access on-prem databases\n# → Use custom licensed tools\n# → Faster (tools already installed, no download time)\n\n# Setup self-hosted agent:\n./config.sh \\\n  --url https://dev.azure.com/myorg \\\n  --auth pat \\\n  --token YOUR_PAT \\\n  --pool 'Internal-EC2-Agents'\nsudo ./svc.sh install && sudo ./svc.sh start" },
      { q: "How does a pipeline authenticate to an AKS cluster?", a: "Via Azure Service Connection linked to the AKS cluster.\n\n🔧 Real-time Example:\nSetup in Azure DevOps:\n  Project Settings → Service Connections\n  → New Service Connection → Kubernetes\n  → Authentication: Azure Subscription\n  → Select your AKS cluster\n  → Name: 'AKS-Production-SC'\n\nIn pipeline:\nsteps:\n  - task: KubernetesManifest@0\n    inputs:\n      action: 'deploy'\n      kubernetesServiceConnection: 'AKS-Production-SC'\n      namespace: 'production'\n      manifests: 'k8s/deployment.yaml'\n      containers: '$(containerRegistry)/myapp:$(Build.BuildId)'\n\nSecurity best practice:\n  Service Connection uses Service Principal\n  SP has role: 'AKS Cluster User' only\n  SP can deploy to 'production' namespace only\n  Not cluster admin → least privilege ✓\n\nAlternative: Workload Identity Federation\n  No secrets! Azure AD identity used directly\n  Most secure approach for new projects" },
      { q: "How do you pass a secret file to Azure DevOps pipeline?", a: "Use Secure Files in Library or Azure Key Vault.\n\n🔧 Real-time Example:\n# Method 1: Secure Files\n# Upload: Pipelines → Library → Secure files → Upload kubeconfig\n\nsteps:\n  - task: DownloadSecureFile@1\n    name: kubeconfig\n    inputs:\n      secureFile: 'production-kubeconfig'\n\n  - script: |\n      mkdir -p ~/.kube\n      cp $(kubeconfig.secureFilePath) ~/.kube/config\n      chmod 600 ~/.kube/config\n      kubectl get pods -n production\n\n# Method 2: Azure Key Vault (preferred)\nsteps:\n  - task: AzureKeyVault@2\n    inputs:\n      azureSubscription: 'Azure-SC'\n      KeyVaultName: 'company-kv'\n      SecretsFilter: 'db-password,ssl-cert,api-key'\n      RunAsPreJob: true\n\n  - script: echo 'DB_PASS=$(db-password)'\n    # Secret auto-masked in logs: DB_PASS=***\n\n# Key Vault advantages:\n# → Centralized secret management\n# → Auto-rotation support\n# → Full audit log of who accessed what\n# → No secrets in pipeline YAML" },
      { q: "How do you handle rollback in Azure pipeline?", a: "Use deployment strategies with on-failure rollback hooks.\n\n🔧 Real-time Example:\nstages:\n  - stage: Deploy\n    jobs:\n      - deployment: DeployProd\n        environment: 'production'\n        strategy:\n          runOnce:\n            deploy:\n              steps:\n                - task: KubernetesManifest@0\n                  inputs:\n                    action: 'deploy'\n                    manifests: 'k8s/deployment.yaml'\n                    containers: '$(tag)'\n\n            on:\n              failure:\n                steps:\n                  - script: |\n                      echo 'Deployment FAILED! Rolling back...'\n                      kubectl rollout undo deployment/myapp -n production\n                      kubectl rollout status deployment/myapp -n production\n                      echo 'Rollback complete'\n                  - task: AzureCLI@2\n                    inputs:\n                      inlineScript: |\n                        curl -X POST $(TEAMS_WEBHOOK) \\\n                          -d '{\"text\":\"⚠️ Production deploy failed - rolled back!\"}'\n\n# Canary strategy with automatic rollback:\n            canary:\n              increments: [10, 25, 50, 100]  # % of traffic\n              preDeploy:\n                steps: [run smoke tests]\n              on:\n                failure:\n                  steps: [kubectl rollout undo]  # auto-rollback!" },
    ]

      { q: "How do you secure application data in production?", a: "Multi-layer security approach:\n\n🔧 Real-time Example:\nEncryption at Rest:\n  RDS: KMS key encryption (AES-256)\n  S3: SSE-KMS on all buckets\n  EBS: Encrypted volumes\n  K8s Secrets: Envelope encryption with KMS\n\nEncryption in Transit:\n  All services: TLS 1.3 only (disable TLS 1.0, 1.1)\n  Internal K8s: mTLS via Istio service mesh\n  DB connections: require_secure_transport=ON\n  HTTP → HTTPS redirect everywhere\n\nAccess Control:\n  DB user: SELECT, INSERT, UPDATE only\n         NO: DROP, DELETE, TRUNCATE\n  S3: Deny all HTTP (only HTTPS)\n  Secrets Manager: auto-rotation every 90 days\n  K8s RBAC: namespace-scoped permissions\n\nNetwork:\n  DB in isolated subnet (no internet route)\n  VPC Endpoints for AWS services (no internet)\n  WAF: block SQL injection, XSS, OWASP Top 10\n  Shield: DDoS protection\n\nData Privacy:\n  PII masked in logs: 'User 1234***@email.com'\n  No sensitive data in URL params (use POST body)\n  GDPR compliance: data retention policies\n  Audit logs for all PII access" },

      { q: "What is the difference between mvn package and mvn deploy?", a: "mvn package: Compile + test + create JAR/WAR in target/ folder (local only)\nmvn deploy: Everything in package + upload to remote repository (Nexus)\n\n🔧 Real-time Example:\n# mvn package — used for testing builds\nmvn package\n# Creates: target/myapp-2.1.0.jar\n# Only on build server — nobody else can get it\n\n# mvn deploy — used for releasing artifacts\nmvn deploy\n# Creates: target/myapp-2.1.0.jar\n# AND uploads to Nexus: http://nexus:8081/repository/maven-releases/\n# Other teams/services can now download: com.company:myapp:2.1.0\n\n# In CI/CD pipeline:\n# Feature branch: mvn package (don't pollute release repo)\n# Main branch after PR merge: mvn deploy (publish for consumption)\n\n# In pom.xml — distributionManagement tells deploy WHERE to upload:\n<distributionManagement>\n  <repository>\n    <id>nexus-releases</id>\n    <url>http://nexus:8081/repository/maven-releases/</url>\n  </repository>\n</distributionManagement>" },
      { q: "What does mvn clean install do?", a: "clean: Delete target/ (old build artifacts)\ninstall: compile + test + package + install to LOCAL Maven repo (~/.m2)\n\n🔧 Real-time Example:\n# Without clean: old .class files may interfere!\n# Scenario: renamed a class → old .class file remains → subtle bug!\n\n# mvn clean install:\n[INFO] Deleting target/          # clean\n[INFO] Compiling 47 source files # compile\n[INFO] Running 120 tests...      # test\n[INFO] Tests run: 120, Failures: 0\n[INFO] Building jar: target/myapp-2.1.0.jar\n[INFO] Installing to ~/.m2/repository/com/company/myapp/2.1.0/\n\n# Why install (not just package)?\n# Multi-module project:\n# project-common depends on nothing\n# project-service depends on project-common\n\nmvn clean install  # in project-common\n# Installs to ~/.m2\n\nmvn clean package  # in project-service\n# Finds project-common in ~/.m2 ✓\n\n# If you used 'package' in common → service can't find it!\n\n# CI/CD best practice:\nmvn clean install -DskipTests  # fast build\nmvn test                        # then test separately" },
      { q: "Explain pom.xml structure.", a: "Project Object Model — Maven's configuration file.\n\n🔧 Real-time Example:\n<?xml version='1.0'?>\n<project>\n  <!-- Coordinates (GAV) — unique identifier -->\n  <groupId>com.company</groupId>      <!-- org -->\n  <artifactId>payment-service</artifactId>  <!-- name -->\n  <version>2.1.0</version>           <!-- version -->\n  <packaging>jar</packaging>\n\n  <!-- Inherit Spring Boot defaults -->\n  <parent>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-parent</artifactId>\n    <version>3.1.0</version>\n  </parent>\n\n  <!-- Reusable variables -->\n  <properties>\n    <java.version>17</java.version>\n  </properties>\n\n  <!-- What your project needs -->\n  <dependencies>\n    <dependency>\n      <groupId>org.springframework.boot</groupId>\n      <artifactId>spring-boot-starter-web</artifactId>\n      <!-- version from parent -->\n    </dependency>\n    <dependency>\n      <groupId>org.postgresql</groupId>\n      <artifactId>postgresql</artifactId>\n      <scope>runtime</scope>    <!-- only at runtime -->\n    </dependency>\n    <dependency>\n      <groupId>junit</groupId>\n      <artifactId>junit</artifactId>\n      <scope>test</scope>       <!-- not in final JAR -->\n    </dependency>\n  </dependencies>\n\n  <!-- Build plugins -->\n  <build>\n    <plugins>\n      <plugin>  <!-- Creates executable JAR -->\n        <groupId>org.springframework.boot</groupId>\n        <artifactId>spring-boot-maven-plugin</artifactId>\n      </plugin>\n      <plugin>  <!-- Code coverage -->\n        <groupId>org.jacoco</groupId>\n        <artifactId>jacoco-maven-plugin</artifactId>\n      </plugin>\n    </plugins>\n  </build>\n</project>" },
      { q: "What is Gradle and have you used it?", a: "Modern build tool — faster than Maven, uses Groovy/Kotlin DSL instead of XML.\n\n🔧 Real-time Example:\n// build.gradle (vs pom.xml)\nplugins {\n  id 'java'\n  id 'org.springframework.boot' version '3.1.0'\n  id 'jacoco'\n}\n\ngroup = 'com.company'\nversion = '2.1.0'\n\ndependencies {\n  implementation 'org.springframework.boot:spring-boot-starter-web'\n  runtimeOnly 'org.postgresql:postgresql'\n  testImplementation 'org.springframework.boot:spring-boot-starter-test'\n}\n\ntest {\n  finalizedBy jacocoTestReport\n}\n\n// Command equivalents:\n// mvn clean package  →  gradle clean build\n// mvn clean install  →  gradle clean build publishToMavenLocal\n// mvn deploy         →  gradle publish\n\n// Key advantage: Build caching\n// First run: gradle build → 3 minutes\n// Second run (nothing changed):\n// > Task :compileJava UP-TO-DATE\n// > Task :test UP-TO-DATE\n// > BUILD SUCCESSFUL in 4 seconds\n// Gradle skipped everything → 45x faster!\n\n// Used in: Android projects (required), many modern Java projects" },

      { q: "How do you handle stressful situations and production incidents?", a: "Structured thinking, clear communication, restore-first approach:\n\n🔧 Real-time Example:\nMy framework:\n\n1. PAUSE before acting\n   → 10 seconds of clear thinking saves 10 minutes of mistakes\n   → Rushed actions cause more problems\n\n2. COMMUNICATE immediately\n   → 'Investigating payment service crash'\n   → Team knows status, no duplicate investigation\n\n3. RESTORE FIRST, investigate later\n   → Roll back takes 2 minutes\n   → Root cause takes 30 minutes\n   → Users don't care about root cause — they want service\n\n4. STRUCTURED DEBUGGING\n   → Assess → Identify → Mitigate → Verify\n   → Follow a process, don't randomly click things\n\n5. TIMEBOX each approach\n   → Stuck for 10 minutes? Get help or try different approach\n   → No ego about asking for assistance\n\nReal example:\nPayment service down, Black Friday, 14:32 PM:\n14:33 → 'Investigating, will update in 5 min'\n14:35 → 'Found: DB connection pool exhausted'\n14:37 → 'Mitigation applied: scaling up connection pool'\n14:39 → 'Service recovering, error rate dropping'\n14:41 → 'Service fully restored'\n\nCalm, structured, clear comms = team stays confident." },

      { q: "What CI/CD tools have you used and why?", a: "Tool selection rationale:\n\n🔧 Real-time Example:\nCurrent stack:\n\nJenkins (primary CI):\n→ 50+ microservices, complex pipeline requirements\n→ Shared libraries prevent code duplication\n→ Rich plugin ecosystem (SonarQube, Nexus, K8s)\n→ Self-hosted → private network access to internal tools\n→ Kubernetes agents for dynamic scaling\n\nArgoCD (GitOps CD):\n→ Kubernetes-native continuous delivery\n→ Git is single source of truth\n→ Drift detection and auto-remediation\n→ Full audit trail (who changed what, when)\n\nSonarQube (code quality):\n→ Static analysis on every PR\n→ Quality Gate blocks bad code before merge\n\nPrevious experience:\nGitHub Actions → open source projects, simpler workflows\nAzure DevOps → previous company, Microsoft ecosystem\nGitLab CI → self-hosted, combined Git + CI in one tool\n\nWhen to choose each:\nGitHub Actions: GitHub-native, small-medium projects\nJenkins: Complex pipelines, self-hosted, rich plugins\nAzure DevOps: Microsoft/Azure ecosystem\nGitLab CI: Self-hosted, want Git + CI together" },
      { q: "How do you handle a production outage during peak hours?", a: "Speed + calm + clear communication:\n\n🔧 Real-time Example: E-commerce down on Black Friday.\n\nT+0:00 Alert fires → acknowledge immediately\n        'On it. Starting investigation.'\n\nT+0:02 Quick impact assessment\n        → How many users affected? (check analytics)\n        → Revenue impact per minute?\n        → Partial or total outage?\n\nT+0:03 RESTORE FIRST — check recent changes\n        git log --oneline --since='1 hour ago'\n        # deployment 15 minutes ago!\n        kubectl rollout history deployment/shop\n        kubectl rollout undo deployment/shop  # instant rollback!\n\nT+0:05 Monitor recovery\n        watch kubectl get pods\n        # error rate: 45% → 20% → 5% → 0% ✓\n\nT+0:08 Service restored\n        → Update status page: 'Resolved'\n        → Notify management: 'Service restored in 8 minutes'\n\nT+0:10 Communicate clearly\n        'Root cause: Memory leak in v2.3.1 under high load.\n         Rolled back to v2.3.0. Investigating fix.'\n\nT+24:00 Post-mortem:\n        Root cause found, fix tested, prevention added,\n        blameless culture, action items assigned." },

// ═══════════════════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════════════════
let currentTopicId = null;
let searchQuery = '';

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
function init() {
  buildSidebar();
  buildWelcomeGrid();
  updateProgress();
}

function buildSidebar() {
  const container = document.getElementById('sidebarTools');
  TOPICS.forEach(topic => {
    const btn = document.createElement('button');
    btn.className = 'tool-btn';
    btn.id = `sidebar-${topic.id}`;
    btn.onclick = () => showTopic(topic.id);
    btn.innerHTML = `
      <span class="tool-emoji">${topic.emoji}</span>
      ${topic.name}
      <span class="tool-count">${topic.questions.length}</span>
    `;
    container.appendChild(btn);
  });
}

function buildWelcomeGrid() {
  const grid = document.getElementById('welcomeGrid');
  TOPICS.forEach(topic => {
    const card = document.createElement('div');
    card.className = 'welcome-card';
    card.onclick = () => showTopic(topic.id);
    card.innerHTML = `
      <div class="wc-icon">${topic.emoji}</div>
      <div class="wc-name">${topic.name}</div>
      <div class="wc-count">${topic.questions.length} questions</div>
    `;
    grid.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════════
// SHOW TOPIC
// ═══════════════════════════════════════════════════════════
function showTopic(topicId) {
  currentTopicId = topicId;
  searchQuery = '';

  // Reset search inputs
  document.querySelectorAll('.search-box').forEach(el => el.value = '');

  // Update sidebar active state
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById(`sidebar-${topicId}`);
  if (activeBtn) activeBtn.classList.add('active');
  const allBtn = document.querySelector('.tool-btn[onclick="showTopic(\'all\')"]');
  if (topicId === 'all' && allBtn) allBtn.classList.add('active');

  // Switch view
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('questionsView').style.display = 'block';

  if (topicId === 'all') {
    renderAll();
  } else {
    const topic = TOPICS.find(t => t.id === topicId);
    if (topic) renderTopic(topic);
  }

  updateProgress();
}

function renderTopic(topic, filteredQuestions = null) {
  const questions = filteredQuestions || topic.questions;

  document.getElementById('topicHeader').innerHTML = `
    <div class="topic-header">
      <div class="topic-icon">${topic.emoji}</div>
      <div>
        <div class="topic-title">${topic.name}</div>
        <div class="topic-subtitle">Interview Questions & Real-time Examples</div>
      </div>
      <div class="topic-badge">${questions.length} Questions</div>
    </div>
  `;

  document.getElementById('qaCount').textContent = `${questions.length} questions`;
  renderQAList(questions, topic);
}

function renderAll(filter = '') {
  let allQ = [];
  TOPICS.forEach(t => {
    t.questions.forEach((q, i) => {
      allQ.push({...q, topicName: t.name, topicEmoji: t.emoji, topicId: t.id, origIdx: i});
    });
  });

  if (filter) {
    allQ = allQ.filter(q =>
      q.q.toLowerCase().includes(filter) || q.a.toLowerCase().includes(filter)
    );
  }

  document.getElementById('topicHeader').innerHTML = `
    <div class="topic-header">
      <div class="topic-icon">🌐</div>
      <div>
        <div class="topic-title">${filter ? 'Search Results' : 'All Topics'}</div>
        <div class="topic-subtitle">${filter ? `Results for "${filter}"` : 'Complete DevOps Interview Guide'}</div>
      </div>
      <div class="topic-badge">${allQ.length} Questions</div>
    </div>
  `;

  document.getElementById('qaCount').textContent = `${allQ.length} questions`;
  renderQAList(allQ, null, filter);
}

function renderQAList(questions, topic, highlight = '') {
  const list = document.getElementById('qaList');
  list.innerHTML = '';

  if (questions.length === 0) {
    list.innerHTML = `
      <div class="no-results">
        <div class="no-results-icon">🔍</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:8px;">No results found</div>
        <div style="color:var(--text3)">Try different keywords or browse topics from the sidebar</div>
      </div>
    `;
    return;
  }

  questions.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'qa-card';
    card.style.animationDelay = `${Math.min(idx * 0.03, 0.5)}s`;

    const topicLabel = item.topicName ? `<span style="font-size:10px;color:var(--text3);margin-left:8px;">[${item.topicEmoji} ${item.topicName}]</span>` : '';
    const qText = highlight ? highlightText(item.q, highlight) : item.q;
    const aText = highlight ? highlightText(item.a, highlight) : item.a;

    const formattedAnswer = formatAnswer(aText);

    card.innerHTML = `
      <div class="qa-question" onclick="toggleCard(this)">
        <span class="q-num">Q${idx + 1}</span>
        <span class="q-text">${qText}${topicLabel}</span>
        <span class="q-arrow">▼</span>
      </div>
      <div class="qa-answer">
        <div class="answer-inner">
          <div class="realtime-tag">🔧 Answer + Real-time Example</div>
          <div class="answer-text">${formattedAnswer}</div>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function formatAnswer(text) {
  // Format code blocks
  let html = escapeHtml(text);

  // Code blocks (lines starting with spaces or common code patterns)
  const lines = html.split('\n');
  let inCode = false;
  let codeLines = [];
  let result = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const isCode = line.startsWith('    ') || line.startsWith('\t') ||
                   (line.match(/^[a-z0-9_-]+\s*[:{(>|#]/) && !line.startsWith('→')) ||
                   line.startsWith('#') || line.startsWith('//') ||
                   line.startsWith('kubectl') || line.startsWith('docker') ||
                   line.startsWith('aws ') || line.startsWith('git ') ||
                   line.startsWith('terraform') || line.startsWith('ansible') ||
                   line.startsWith('helm ') || line.startsWith('curl ') ||
                   line.startsWith('export ') || line.startsWith('sudo ') ||
                   line.startsWith('apt') || line.startsWith('yum') ||
                   line.startsWith('mvn ') || line.startsWith('gradle ') ||
                   (line.includes('(') && line.includes(')') && line.startsWith(' '));

    if (isCode && !line.startsWith('→') && line.trim() !== '') {
      if (!inCode) {
        inCode = true;
        codeLines = [];
      }
      codeLines.push(line);
    } else {
      if (inCode) {
        result.push(`<pre class="code-block">${codeLines.join('\n')}</pre>`);
        inCode = false;
        codeLines = [];
      }
      result.push(line);
    }
  }

  if (inCode && codeLines.length > 0) {
    result.push(`<pre class="code-block">${codeLines.join('\n')}</pre>`);
  }

  return result.join('\n');
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function highlightText(text, query) {
  if (!query) return text;
  const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
  return text.replace(regex, '<span class="search-highlight">$1</span>');
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ═══════════════════════════════════════════════════════════
// TOGGLE Q&A
// ═══════════════════════════════════════════════════════════
function toggleCard(questionEl) {
  const card = questionEl.parentElement;
  card.classList.toggle('open');
}

function expandAll() {
  document.querySelectorAll('.qa-card').forEach(c => c.classList.add('open'));
}

function collapseAll() {
  document.querySelectorAll('.qa-card').forEach(c => c.classList.remove('open'));
}

// ═══════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════
let searchTimeout;
function handleSearch(value) {
  // Sync both search boxes
  document.querySelectorAll('.search-box').forEach(el => el.value = value);

  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = value.toLowerCase().trim();

    if (!searchQuery) {
      if (currentTopicId) showTopic(currentTopicId);
      else {
        document.getElementById('welcomeScreen').style.display = 'flex';
        document.getElementById('questionsView').style.display = 'none';
      }
      return;
    }

    // Show questions view
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('questionsView').style.display = 'block';

    if (currentTopicId && currentTopicId !== 'all') {
      const topic = TOPICS.find(t => t.id === currentTopicId);
      if (topic) {
        const filtered = topic.questions.filter(q =>
          q.q.toLowerCase().includes(searchQuery) || q.a.toLowerCase().includes(searchQuery)
        );
        renderTopic(topic, filtered);
        // Re-render with highlighting
        const allQ = filtered.map((q, i) => ({...q, origIdx: i}));
        renderQAList(allQ, topic, searchQuery);
        document.getElementById('qaCount').textContent = `${filtered.length} results`;
      }
    } else {
      currentTopicId = 'all';
      renderAll(searchQuery);
    }
  }, 200);
}

// ═══════════════════════════════════════════════════════════
// PROGRESS BAR (scroll-based)
// ═══════════════════════════════════════════════════════════
function updateProgress() {
  const content = document.getElementById('mainContent');
  content.addEventListener('scroll', () => {
    const scrollPercent = content.scrollTop / (content.scrollHeight - content.clientHeight) * 100;
    document.getElementById('progressFill').style.width = scrollPercent + '%';
  });
}

// ═══════════════════════════════════════════════════════════
// KEYBOARD SHORTCUT: / to focus search
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    const search = document.getElementById('searchMain') || document.getElementById('searchWelcome');
    if (search) search.focus();
  }
  if (e.key === 'Escape') {
    document.querySelectorAll('.search-box').forEach(el => {
      el.value = '';
      el.blur();
    });
    if (currentTopicId) showTopic(currentTopicId);
  }
});

// ═══════════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════════
init();
</script>
