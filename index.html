<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Interview Prep — Master Guide</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #0f1526;
    --bg3: #151c32;
    --panel: #1a2240;
    --panel2: #1e2845;
    --border: #2a3a60;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --accent4: #f59e0b;
    --accent5: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --glow: rgba(0,212,255,0.15);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,14,26,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo span { color: var(--accent); }

  .header-stats {
    display: flex;
    gap: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text2);
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
  }

  .stat-dot { width:6px; height:6px; border-radius:50%; background:var(--accent3); animation: pulse 2s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── SEARCH BAR ── */
  .search-wrap {
    padding: 24px 24px 0;
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
  }

  .search-box {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px 14px 48px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: all 0.2s;
  }

  .search-box::placeholder { color: var(--text3); }
  .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }

  .search-icon {
    position: absolute;
    left: 40px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 16px;
  }

  /* ── MAIN LAYOUT ── */
  .main {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 64px);
    position: relative;
    z-index: 1;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-title {
    padding: 8px 20px 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text3);
    text-transform: uppercase;
  }

  .tool-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 20px;
    border: none;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    border-left: 3px solid transparent;
    position: relative;
  }

  .tool-btn:hover { background: var(--panel); color: var(--text); }

  .tool-btn.active {
    background: var(--panel);
    color: var(--accent);
    border-left-color: var(--accent);
  }

  .tool-emoji { font-size: 16px; width: 24px; text-align: center; }

  .tool-count {
    margin-left: auto;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
  }

  .tool-btn.active .tool-count {
    background: rgba(0,212,255,0.1);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── CONTENT ── */
  .content {
    overflow-y: auto;
    padding: 24px;
  }

  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── TOPIC HEADER ── */
  .topic-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding: 20px 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
  }

  .topic-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,212,255,0.05), transparent);
    pointer-events: none;
  }

  .topic-icon { font-size: 40px; }

  .topic-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .topic-subtitle { color: var(--text2); font-size: 13px; margin-top: 2px; }

  .topic-badge {
    margin-left: auto;
    background: rgba(0,212,255,0.1);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ── Q&A CARDS ── */
  .qa-list { display: flex; flex-direction: column; gap: 12px; }

  .qa-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }

  .qa-card:hover { border-color: rgba(0,212,255,0.3); }
  .qa-card.open { border-color: var(--accent); }

  .qa-question {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 20px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }

  .qa-question:hover { background: var(--panel2); }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 6px;
    padding: 2px 8px;
    min-width: 40px;
    text-align: center;
    margin-top: 1px;
    flex-shrink: 0;
  }

  .q-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    line-height: 1.5;
  }

  .q-arrow {
    color: var(--text3);
    font-size: 12px;
    margin-top: 3px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .qa-card.open .q-arrow { transform: rotate(180deg); color: var(--accent); }

  .qa-answer {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--bg3);
  }

  .qa-card.open .qa-answer { display: block; }

  .answer-inner { padding: 20px 24px; }

  .answer-text {
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--text2);
    white-space: pre-wrap;
    font-family: 'Syne', sans-serif;
  }

  /* Code blocks inside answers */
  .answer-text code,
  pre.code-block {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  .code-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin: 12px 0;
    overflow-x: auto;
    color: #a8d8a8;
    line-height: 1.6;
    white-space: pre;
  }

  .realtime-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.3);
    color: var(--accent3);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  /* ── SEARCH RESULTS ── */
  .search-results-header {
    padding: 12px 0 16px;
    color: var(--text2);
    font-size: 13px;
  }

  .search-highlight {
    background: rgba(245,158,11,0.25);
    color: var(--accent4);
    border-radius: 3px;
    padding: 0 2px;
  }

  /* ── PROGRESS BAR ── */
  .progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--border);
    z-index: 200;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.3s;
    width: 0%;
  }

  /* ── WELCOME SCREEN ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 40px;
    gap: 32px;
  }

  .welcome-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 800px;
  }

  .welcome-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }

  .welcome-card:hover {
    border-color: var(--accent);
    background: var(--panel2);
    transform: translateY(-2px);
  }

  .wc-icon { font-size: 24px; margin-bottom: 8px; }
  .wc-name { font-size: 13px; font-weight: 700; }
  .wc-count { font-size: 11px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }

  .welcome-title {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.2;
  }

  .welcome-title span { color: var(--accent); }

  .welcome-sub {
    color: var(--text2);
    font-size: 15px;
    max-width: 500px;
  }

  /* ── NO RESULTS ── */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }

  .no-results-icon { font-size: 48px; margin-bottom: 16px; }

  /* ── EXPAND ALL BTN ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .toolbar-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }

  .toolbar-count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text3);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .welcome-grid { grid-template-columns: repeat(2,1fr); }
    .header-stats { display: none; }
  }

  /* Scroll reveal animation */
  .qa-card {
    animation: slideIn 0.2s ease forwards;
    opacity: 0;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">⚙️</div>
    DevOps <span>Interview</span> Prep
  </div>
  <div class="header-stats">
    <div class="stat-pill"><div class="stat-dot"></div><span id="totalQ">613 Questions</span></div>
    <div class="stat-pill">15 Topics</div>
    <div class="stat-pill">Real-time Examples</div>
  </div>
</header>

<!-- Main Layout -->
<div class="main">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-title">Topics</div>
    <button class="tool-btn" onclick="showTopic('all')">
      <span class="tool-emoji">🌐</span> All Topics
      <span class="tool-count">613</span>
    </button>
    <div id="sidebarTools"></div>
  </nav>

  <!-- Content -->
  <main class="content" id="mainContent">
    <!-- Welcome screen shown by default -->
    <div class="welcome" id="welcomeScreen">
      <div>
        <div class="welcome-title">Master DevOps<br><span>Interview Questions</span></div>
        <p class="welcome-sub">613 questions across 15 tools — all with real-time examples and hands-on code samples</p>
      </div>

      <!-- Search bar in welcome -->
      <div style="width:100%;max-width:600px;position:relative;">
        <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;">🔍</span>
        <input type="text" id="searchWelcome" placeholder="Search any question, tool, or concept..." class="search-box" style="width:100%;padding-left:44px;" oninput="handleSearch(this.value)">
      </div>

      <div class="welcome-grid" id="welcomeGrid"></div>
    </div>

    <!-- Questions View -->
    <div id="questionsView" style="display:none;">
      <div style="position:relative;margin-bottom:20px;">
        <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;z-index:1;">🔍</span>
        <input type="text" id="searchMain" placeholder="Search within this topic..." class="search-box" oninput="handleSearch(this.value)">
      </div>
      <div id="topicHeader"></div>
      <div class="toolbar">
        <button class="toolbar-btn" onclick="expandAll()">▼ Expand All</button>
        <button class="toolbar-btn" onclick="collapseAll()">▲ Collapse All</button>
        <span class="toolbar-count" id="qaCount"></span>
      </div>
      <div class="qa-list" id="qaList"></div>
    </div>
  </main>

</div>

<!-- Progress bar -->
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<script>
// ═══════════════════════════════════════════════════════════
// DATA — All 613 Questions & Answers
// ═══════════════════════════════════════════════════════════
const TOPICS = [
  {
    id: 'jenkins',
    name: 'Jenkins',
    emoji: '🚀',
    color: '#f59e0b',
    questions: [
      { q: "What is Pipeline as Code in Jenkins?", a: "Defining CI/CD pipeline logic in a Jenkinsfile stored in the source repo, enabling version control of pipeline configuration.\n\n🔧 Real-time Example:\nInstead of configuring jobs via UI, you commit a Jenkinsfile to your Git repo:\n\npipeline {\n  agent any\n  stages {\n    stage('Build') { steps { sh 'mvn clean package' } }\n    stage('Test')  { steps { sh 'mvn test' } }\n    stage('Deploy'){ steps { sh './deploy.sh' } }\n  }\n}\n\nNow your pipeline is versioned alongside your code. Any developer can see exactly what runs. PRs can update the pipeline just like any other code." },
      { q: "What is the difference between Declarative and Scripted pipeline?", a: "Declarative: Structured, easier syntax using pipeline {} block. Recommended for most teams.\nScripted: Groovy-based, more flexible but complex. Uses node {} block.\n\n🔧 Real-time Example:\n// Declarative (recommended)\npipeline {\n  agent any\n  stages {\n    stage('Build') { steps { sh 'mvn package' } }\n  }\n}\n\n// Scripted (flexible)\nnode {\n  stage('Build') { sh 'mvn package' }\n}\n\nUse Declarative for standard CI/CD flows. Use Scripted when you need complex Groovy logic like dynamic stage generation." },
      { q: "What stages do you use in your CI/CD pipeline?", a: "Checkout → Build → Unit Test → Code Analysis (SonarQube) → Quality Gate → Docker Build → Image Scan (Trivy) → Push to Registry → Deploy to Dev/UAT/Prod\n\n🔧 Real-time Example:\nstages {\n  stage('Checkout')     { steps { git url: 'https://...' } }\n  stage('Build')        { steps { sh 'mvn clean package' } }\n  stage('Unit Tests')   { steps { sh 'mvn test' } }\n  stage('SonarQube')    { steps { withSonarQubeEnv('SQ') { sh 'mvn sonar:sonar' } } }\n  stage('Quality Gate') { steps { waitForQualityGate abortPipeline: true } }\n  stage('Docker Build') { steps { sh 'docker build -t myapp:${BUILD_NUMBER} .' } }\n  stage('Trivy Scan')   { steps { sh 'trivy image myapp:${BUILD_NUMBER}' } }\n  stage('Push Image')   { steps { sh 'docker push myrepo/myapp:${BUILD_NUMBER}' } }\n  stage('Deploy Dev')   { steps { sh 'kubectl apply -f k8s/ -n dev' } }\n}" },
      { q: "How do you trigger a pipeline automatically on code push?", a: "Using webhooks in GitHub/GitLab pointing to Jenkins URL. Jenkins receives the push event and triggers the job automatically.\n\n🔧 Real-time Example:\n1. GitHub Repo → Settings → Webhooks → Add webhook\n   Payload URL: http://jenkins-url/github-webhook/\n   Content type: application/json\n   Events: Pushes + Pull requests\n\n2. Jenkins Job → Configure → Build Triggers:\n   ✅ GitHub hook trigger for GITScm polling\n\nDeveloper pushes → GitHub fires webhook → Jenkins triggers in < 1 second → Pipeline runs automatically." },
      { q: "How do you store credentials securely in Jenkins?", a: "Via Jenkins Credentials Manager (Manage Jenkins → Credentials). Use withCredentials or credentials() in pipeline.\n\n🔧 Real-time Example:\n// In Jenkinsfile — reference by credential ID\nwithCredentials([\n  usernamePassword(\n    credentialsId: 'nexus-creds',\n    usernameVariable: 'NEXUS_USER',\n    passwordVariable: 'NEXUS_PASS'\n  )\n]) {\n  sh 'docker login -u $NEXUS_USER -p $NEXUS_PASS registry.company.com'\n}\n\nCredentials are masked in logs. Never appear in code." },
      { q: "How do you manage secrets in CI/CD?", a: "Jenkins Credentials Store, HashiCorp Vault integration, Environment variables injected at runtime — never hardcoded.\n\n🔧 Real-time Example:\n// Pull secret from AWS Secrets Manager in pipeline\nstage('Get Secrets') {\n  steps {\n    script {\n      def secret = sh(script: '''\n        aws secretsmanager get-secret-value \\\n          --secret-id prod/myapp/db \\\n          --query SecretString --output text\n      ''', returnStdout: true).trim()\n      env.DB_PASSWORD = readJSON(text: secret).password\n    }\n  }\n}" },
      { q: "What is a Quality Gate?", a: "A set of conditions in SonarQube that code must pass before proceeding in the pipeline. Think of it as a pass/fail threshold.\n\n🔧 Real-time Example:\nCustom Quality Gate: 'Company Standard'\n  ✅ Coverage ≥ 75%\n  ✅ No new Blocker issues\n  ✅ No new Critical issues\n  ✅ Duplicated lines < 5%\n  ✅ Security Rating = A\n\nDeveloper writes SQL injection vulnerability → SonarQube detects it → Quality Gate FAILS → Pipeline aborts → Code never reaches production." },
      { q: "How does SonarQube fail the pipeline when quality gate fails?", a: "SonarQube returns a FAILED status on the Quality Gate; Jenkins checks this via waitForQualityGate() and aborts the pipeline.\n\n🔧 Real-time Example:\nstage('Quality Gate') {\n  steps {\n    timeout(time: 5, unit: 'MINUTES') {\n      waitForQualityGate abortPipeline: true  // abort if FAILED\n    }\n  }\n}\n\nSonarQube finishes analysis → posts webhook back to Jenkins → waitForQualityGate receives result → if FAILED, marks build as failed." },
      { q: "What does waitForQualityGate do in the pipeline?", a: "Pauses the pipeline and polls SonarQube until the Quality Gate result is available, then passes or fails the stage accordingly.\n\n🔧 Real-time Example:\nSonarQube analysis can take 2-3 minutes on large codebases. Without waitForQualityGate, the pipeline would continue without knowing if quality passed.\n\nwaitForQualityGate:\n→ Pauses Jenkins execution\n→ SonarQube sends webhook when analysis complete\n→ Jenkins receives: {status: 'OK'} or {status: 'ERROR'}\n→ Pipeline continues (OK) or aborts (ERROR)" },
      { q: "If a Jenkins job fails, how do you troubleshoot?", a: "Check Console Output → Review error logs → Check workspace files → Verify credentials/env vars → Reproduce locally if needed.\n\n🔧 Real-time Example:\nPipeline fails at Docker push stage.\n1. Click 'Console Output' in Jenkins\n2. Ctrl+F for 'ERROR' → find: 'unauthorized: authentication required'\n3. ECR credentials expired — check expiry date\n4. Update credentials in Jenkins Credentials Manager\n5. Re-run pipeline → SUCCESS" },
      { q: "If a pipeline is slow, how do you optimize it?", a: "Run stages in parallel, cache dependencies, use faster agents, skip unnecessary stages for minor changes.\n\n🔧 Real-time Example:\n// Before: 45 minutes (sequential)\nstage('Test')     { sh 'mvn test' }      // 15 min\nstage('Lint')     { sh 'npm run lint' }  // 10 min\nstage('Security') { sh 'trivy scan' }   // 10 min\nstage('Build')    { sh 'docker build' } // 10 min\n\n// After: 20 minutes (parallel)\nstage('Parallel Checks') {\n  parallel {\n    stage('Test')     { sh 'mvn test' }\n    stage('Lint')     { sh 'npm run lint' }\n    stage('Security') { sh 'trivy scan' }\n  }\n}\nstage('Build') { sh 'docker build' }  // only after all pass" },
      { q: "What is Jenkins shared library?", a: "Reusable Groovy code stored in a separate repo and imported across multiple pipelines to avoid duplication.\n\n🔧 Real-time Example:\n// In shared library: vars/buildAndDeploy.groovy\ndef call(Map config) {\n  pipeline {\n    agent any\n    stages {\n      stage('Build') { steps { sh \"mvn clean package\" } }\n      stage('Deploy') { steps { sh \"kubectl apply -f k8s/ -n ${config.namespace}\" } }\n    }\n  }\n}\n\n// In any Jenkinsfile — reuse it!\n@Library('company-shared-lib') _\nbuildAndDeploy(namespace: 'production')\n\n50 microservices all use same library. Update once → all pipelines updated." },
      { q: "What are default variables in Jenkins?", a: "BUILD_NUMBER, BUILD_ID, JOB_NAME, WORKSPACE, JENKINS_URL, GIT_COMMIT, GIT_BRANCH, BUILD_URL\n\n🔧 Real-time Example:\nstage('Tag Docker Image') {\n  steps {\n    sh '''\n      docker build -t myapp:${BUILD_NUMBER} .\n      echo \"Built by job: ${JOB_NAME}\"\n      echo \"Git commit: ${GIT_COMMIT}\"\n      echo \"Branch: ${GIT_BRANCH}\"\n    '''\n  }\n}\n\nUse BUILD_NUMBER as image tag → every image uniquely tagged → full traceability from production image back to Git commit." },
      { q: "What is agent any in Jenkins?", a: "Runs the pipeline on any available Jenkins agent/node. Jenkins picks the first available executor.\n\n🔧 Real-time Example:\npipeline {\n  agent any  // ← runs on ANY available agent\n  // vs:\n  agent { label 'linux' }   // specific OS\n  agent { label 'docker' }  // agent with Docker\n  agent none                // define per stage\n  agent { docker { image 'maven:3.9' } }  // run in container\n}\n\nIn production: avoid 'agent any' — use specific labels to ensure builds run on correct environment (right OS, right tools installed)." },
      { q: "What is label in Jenkins?", a: "A tag assigned to a node/agent. Used in agent { label 'linux' } to run a stage on a specific node.\n\n🔧 Real-time Example:\n// Assign labels to nodes:\n// Agent 1: labels = 'linux docker maven'\n// Agent 2: labels = 'windows dotnet'\n// Agent 3: labels = 'linux gpu ml'\n\nstage('Build Java') {\n  agent { label 'linux && maven' }  // must have both labels\n  steps { sh 'mvn package' }\n}\n\nstage('ML Training') {\n  agent { label 'gpu' }  // run on GPU node\n  steps { sh 'python train.py' }\n}" },
      { q: "Can we run parallel stages in Jenkins?", a: "Yes, using the parallel block inside a stage.\n\n🔧 Real-time Example:\nstage('Parallel Testing') {\n  parallel {\n    stage('Unit Tests') {\n      steps { sh 'mvn test -Dtest=Unit*' }\n    }\n    stage('Integration Tests') {\n      steps { sh 'mvn test -Dtest=Integration*' }\n    }\n    stage('Security Scan') {\n      steps { sh 'trivy image myapp:latest' }\n    }\n  }\n}\n\nAll 3 run simultaneously on different agents. Total time = slowest stage, not sum of all." },
      { q: "What is Blue-Green deployment in Jenkins?", a: "Two identical environments. Pipeline deploys to Green, tests it, then switches traffic from Blue to Green.\n\n🔧 Real-time Example:\nstage('Blue-Green Deploy') {\n  steps {\n    // Deploy to green environment\n    sh 'kubectl apply -f k8s/green/ -n production'\n    sh 'kubectl rollout status deployment/myapp-green'\n    \n    // Run smoke tests on green\n    sh './tests/smoke-test.sh green'\n    \n    // Switch traffic to green\n    sh \"kubectl patch svc myapp -p '{\\\"spec\\\":{\\\"selector\\\":{\\\"slot\\\":\\\"green\\\"}}}'\"\n    \n    // Old blue becomes standby\n    echo 'Traffic switched to Green. Blue is standby for rollback.'\n  }\n}" },
      { q: "How do you integrate tools like SonarQube, Maven, Docker, Ansible into Jenkins pipeline?", a: "Each tool has a dedicated stage:\n\n🔧 Real-time Example:\nstages {\n  stage('Maven Build') {\n    steps { sh 'mvn clean package -DskipTests' }\n  }\n  stage('SonarQube') {\n    steps {\n      withSonarQubeEnv('SonarQube-Server') {\n        sh 'mvn sonar:sonar'\n      }\n    }\n  }\n  stage('Docker Build & Push') {\n    steps {\n      sh 'docker build -t myapp:${BUILD_NUMBER} .'\n      withDockerRegistry([credentialsId:'ecr-creds']) {\n        sh 'docker push myrepo/myapp:${BUILD_NUMBER}'\n      }\n    }\n  }\n  stage('Ansible Deploy') {\n    steps {\n      sh 'ansible-playbook -i inventory deploy.yml -e version=${BUILD_NUMBER}'\n    }\n  }\n}" },
      { q: "What is the difference between Continuous Delivery and Continuous Deployment?", a: "Delivery: Code is automatically tested and ready to deploy — deployment needs manual approval.\nDeployment: Code is automatically deployed to production without manual intervention.\n\n🔧 Real-time Example:\nContinuous Delivery:\n  Code → Build → Test → Staging → [MANUAL APPROVAL] → Production\n  Human decides when to release. Finance/healthcare teams often use this.\n\nContinuous Deployment:\n  Code → Build → Test → Staging → [AUTO] → Production\n  Every commit that passes tests goes to production automatically.\n  Netflix, Amazon use this model." },
      { q: "How do you trigger a pipeline when a PR is raised?", a: "Use GitHub Pull Request Builder plugin or configure webhook for pull_request events.\n\n🔧 Real-time Example:\nIn Jenkinsfile:\ntriggers {\n  githubPullRequests(\n    spec: '',\n    triggerMode: 'HEAVY_HOOKS',\n    events: [Open(), Commit()],\n    branchRestriction: TargetBranchRestriction(['main', 'develop'])\n  )\n}\n\nPR raised on GitHub → webhook fires → Jenkins triggers pipeline → Posts ✅ or ❌ status back to GitHub PR → Developer sees result before merge." },
      { q: "What are upstream and downstream jobs in Jenkins?", a: "Upstream: Job that triggers another job. Downstream: Job that gets triggered.\n\n🔧 Real-time Example:\nUpstream: 'build-myapp' triggers\n  → Downstream: 'test-myapp'\n  → Downstream: 'deploy-to-dev'\n\nIn pipeline:\n// In build job\npost {\n  success {\n    build job: 'test-myapp',  // trigger downstream\n      parameters: [string(name: 'VERSION', value: BUILD_NUMBER)]\n  }\n}\n\nBenefit: Separate concerns — build team owns build job, QA team owns test job." },
      { q: "What is an agent in Jenkins?", a: "A machine (physical/VM/container) that executes pipeline jobs. The master delegates work to agents.\n\n🔧 Real-time Example:\nJenkins Master (controller):\n  → Manages UI, stores config, schedules jobs\n  → Should NOT run builds directly in production\n\nJenkins Agents:\n  → Linux Agent: runs Java/Docker builds\n  → Windows Agent: runs .NET builds\n  → K8s Agent: dynamic pods that spin up/down per build\n\nKubernetes dynamic agents:\npipeline {\n  agent {\n    kubernetes {\n      yaml '''\napiVersion: v1\nkind: Pod\nspec:\n  containers:\n  - name: maven\n    image: maven:3.9-jdk-17\n'''\n    }\n  }\n}" },
      { q: "How do you perform zero-downtime Jenkins upgrade?", a: "Backup → Snapshot → Stop → Update → Start → Verify.\n\n🔧 Real-time Example:\n# Step 1: Backup Jenkins home\ntar -czf jenkins-backup-$(date +%Y%m%d).tar.gz /var/lib/jenkins/\naws s3 cp jenkins-backup-$(date +%Y%m%d).tar.gz s3://backups/jenkins/\n\n# Step 2: Snapshot EC2\naws ec2 create-snapshot --volume-id vol-123 --description 'pre-upgrade'\n\n# Step 3: Update during low traffic window\nsystemctl stop jenkins\napt-get install jenkins=2.450\nsystemctl start jenkins\n\n# Step 4: Verify\ncurl http://localhost:8080/api/json?pretty=true\n# Check all plugins load, run test pipeline" },
      { q: "A Jenkins stage fails due to credential issues — how do you fix it?", a: "Verify credential ID in Jenkins → Check expiry → Re-enter credentials → Ensure pipeline references correct ID.\n\n🔧 Real-time Example:\nError: 'CredentialsNotFoundException: No credentials found with id docker-registry-creds'\n\n// Check pipeline — typo in ID:\nwithCredentials([usernamePassword(credentialsId: 'docker-regisrty-creds')]) {\n// Should be: 'docker-registry-creds'\n\nFix:\n1. Manage Jenkins → Credentials → Find exact ID\n2. Copy exact ID → paste into Jenkinsfile\n3. If credentials expired → update them\n4. Re-run pipeline → SUCCESS" },
      { q: "What happens if Quality Gate fails and abortPipeline: false is set?", a: "Pipeline continues but marks the stage as unstable. Useful for generating reports without blocking deployments in lower environments.\n\n🔧 Real-time Example:\nstage('Quality Gate') {\n  steps {\n    waitForQualityGate abortPipeline: false  // don't abort\n  }\n}\n\nBuild result: UNSTABLE (yellow) not FAILED (red)\n\nUse case: Dev environment — you want to see QG results but don't want to block every single dev build. Production pipeline always uses abortPipeline: true." },
      { q: "If a pipeline fails due to missing environment variables, how do you fix it?", a: "Add the variable to Jenkins environment config or pipeline environment {} block.\n\n🔧 Real-time Example:\nError: 'DB_HOST: unbound variable'\n\n// Fix 1: Add to pipeline environment block\npipeline {\n  environment {\n    DB_HOST = 'prod-db.company.com'\n    DB_PORT = '5432'\n    DB_PASSWORD = credentials('db-password-secret')  // from credentials\n  }\n}\n\n// Fix 2: Check if variable group linked correctly\n// Manage Jenkins → Configure System → Global properties → Environment variables\n\n// Fix 3: Pass at runtime\njenkinsJob.build(parameters: [string(name: 'DB_HOST', value: 'prod-db')])" },
    ]
  },
  {
    id: 'docker',
    name: 'Docker',
    emoji: '🐳',
    color: '#0ea5e9',
    questions: [
      { q: "What is Docker and explain its architecture?", a: "Docker is a platform that packages apps and dependencies into lightweight, portable containers.\n\nArchitecture components:\n• Docker Client: CLI (docker commands)\n• Docker Daemon (dockerd): Background service managing containers\n• Docker Registry: Stores images (DockerHub, ECR, ACR)\n• containerd: Low-level container runtime\n\n🔧 Real-time Example:\ndocker run nginx flow:\n1. Client sends request to Daemon\n2. Daemon checks if 'nginx' image exists locally\n3. If not → pulls from DockerHub Registry\n4. Creates container via containerd\n5. Nginx starts serving on container port 80" },
      { q: "What is the difference between Docker image and Docker container?", a: "Image: Read-only blueprint/template (like a class in OOP)\nContainer: Running instance of an image (like an object)\n\n🔧 Real-time Example:\nnginx:latest  ← Image (stored in registry, doing nothing)\n\ndocker run nginx  ← Creates a Container (live, running process)\n\nYou can run 10 containers from the same image simultaneously:\ndocker run -d -p 8081:80 nginx  # Container 1\ndocker run -d -p 8082:80 nginx  # Container 2\ndocker run -d -p 8083:80 nginx  # Container 3" },
      { q: "What is the difference between COPY and ADD?", a: "COPY: Simply copies files from host to image (preferred)\nADD: Everything COPY does + extracts tar files + supports URLs\n\n🔧 Real-time Example:\n# COPY — simple, predictable (always prefer this)\nCOPY app.jar /app/app.jar\nCOPY src/ /app/src/\n\n# ADD — use ONLY when you need its extra features\nADD app.tar.gz /app/        # Auto-extracts archive\nADD https://example.com/config.json /app/  # Download file\n\nBest practice: ALWAYS use COPY unless you specifically need tar extraction or URL download. ADD has unexpected behavior." },
      { q: "What is the difference between CMD and ENTRYPOINT?", a: "CMD: Default command — can be overridden at runtime\nENTRYPOINT: Fixed command — always runs, args can be appended\n\n🔧 Real-time Example:\n# CMD — overrideable\nCMD [\"python\", \"app.py\"]\ndocker run myimage python test.py  # overrides CMD completely\n\n# ENTRYPOINT — always runs\nENTRYPOINT [\"python\"]\nCMD [\"app.py\"]           # default arg\ndocker run myimage test.py  # runs: python test.py\n\nBest combination for production:\nENTRYPOINT [\"java\", \"-jar\"]  # always java\nCMD [\"app.jar\"]              # default jar (overrideable)" },
      { q: "How do you reduce Docker image size?", a: "Use minimal base images, multi-stage builds, combine RUN commands, .dockerignore.\n\n🔧 Real-time Example:\n# BEFORE: 800MB Java image\nFROM openjdk:17\nCOPY . .\nRUN mvn package\nCMD [\"java\", \"-jar\", \"target/app.jar\"]\n\n# AFTER: 120MB (multi-stage + alpine)\nFROM maven:3.9-alpine AS build\nCOPY pom.xml .\nRUN mvn dependency:go-offline  # cache deps\nCOPY src ./src\nRUN mvn package -DskipTests\n\nFROM openjdk:17-jre-alpine      # JRE only, alpine base\nCOPY --from=build /app/target/app.jar app.jar\nCMD [\"java\", \"-jar\", \"app.jar\"]\n\n85% size reduction → faster pulls, less storage cost!" },
      { q: "What is a multi-stage Docker build?", a: "Use multiple FROM statements. Each stage can copy artifacts from previous stages. Final image only contains what's needed to run.\n\n🔧 Real-time Example: Node.js app\n# Stage 1: Build (has all dev tools)\nFROM node:18 AS builder\nWORKDIR /app\nCOPY package*.json ./\nRUN npm install\nCOPY . .\nRUN npm run build       # webpack, babel, etc.\n\n# Stage 2: Production (only runtime)\nFROM node:18-alpine\nWORKDIR /app\nCOPY --from=builder /app/dist ./dist\nCOPY --from=builder /app/node_modules ./node_modules\nCMD [\"node\", \"dist/server.js\"]\n\nResult: 1.2GB build → 180MB production image\nNo source code, no build tools in final image." },
      { q: "What is Docker Compose?", a: "A tool for defining and running multi-container applications using a docker-compose.yml file.\n\n🔧 Real-time Example:\nversion: '3'\nservices:\n  app:\n    build: .\n    ports:\n      - \"3000:3000\"\n    environment:\n      - DB_HOST=mongo\n    depends_on:\n      - mongo\n      - redis\n  mongo:\n    image: mongo:6\n    volumes:\n      - mongo-data:/data/db\n  redis:\n    image: redis:alpine\n\nvolumes:\n  mongo-data:\n\ndocker-compose up → entire stack (Node + MongoDB + Redis) running in ONE command. Perfect for local development and integration testing." },
      { q: "What are Docker volumes?", a: "Persistent storage that exists outside the container lifecycle. Data survives container restarts and deletions.\n\n🔧 Real-time Example:\n# WITHOUT volume: data lost when container deleted!\ndocker run mysql:8  # delete container → ALL data gone!\n\n# WITH named volume: data persists\ndocker run -v mysql-data:/var/lib/mysql mysql:8\n# Container deleted → data in 'mysql-data' volume → safe\n# New container mounts same volume → data intact\n\n# Three types:\n# Named volume (managed by Docker — production)\ndocker run -v postgres-data:/var/lib/postgresql/data postgres\n\n# Bind mount (host path — development)\ndocker run -v $(pwd)/src:/app/src myapp  # live reload!\n\n# tmpfs (in memory — sensitive data)\ndocker run --tmpfs /app/secrets myapp" },
      { q: "What does EXPOSE 8080 do in a Dockerfile?", a: "Documents that the container listens on port 8080. It does NOT actually publish the port — it's just metadata.\n\n🔧 Real-time Example:\nDockerfile:\nEXPOSE 8080    # Just documentation!\n\n# This does NOT make port accessible from host\ndocker run myapp         # port 8080 NOT accessible\n\n# -p flag actually maps port\ndocker run -p 8080:8080 myapp  # NOW accessible!\ndocker run -p 80:8080 myapp    # host:80 → container:8080\n\nEXPOSE tells developers and docker-compose which ports the app uses. The actual binding requires -p at runtime." },
      { q: "What is the Docker container lifecycle?", a: "Created → Running → Paused → Stopped → Deleted\n\n🔧 Real-time Example:\ndocker create nginx          # Created (not running)\ndocker start <container>     # Running\ndocker pause <container>     # Paused (frozen, CPU released)\ndocker unpause <container>   # Running again\ndocker stop <container>      # Stopped (graceful SIGTERM → 10s → SIGKILL)\ndocker kill <container>      # Stopped immediately (SIGKILL)\ndocker rm <container>        # Deleted\n\n# docker run = docker create + docker start\n# docker run -d -p 80:80 --name web nginx\n\nKey: stop sends SIGTERM first (graceful shutdown) — app can cleanup DB connections, finish requests. kill is immediate." },
      { q: "How do you troubleshoot a running container?", a: "Systematic debugging approach:\n\n🔧 Real-time Example: Container running but app not responding.\n\n# Step 1: Is it really running?\ndocker ps\n\n# Step 2: Check logs\ndocker logs myapp\ndocker logs -f myapp --tail 100\n\n# Step 3: Check config\ndocker inspect myapp | grep -A 5 'Ports'\n# Found: port mapping is 8081:8080 not 8080:8080!\n\n# Step 4: Resource usage\ndocker stats myapp\n# CONTAINER  CPU %  MEM USAGE / LIMIT\n# myapp      95.0%  450MiB / 512MiB  ← OOM risk!\n\n# Step 5: Shell into container\ndocker exec -it myapp /bin/sh\nls /app/config/    # config file missing!\n\n# Fix: copy config file, rebuild image" },
      { q: "What are Docker networks? Explain each type.", a: "bridge (default), host, none, overlay (Swarm), macvlan\n\n🔧 Real-time Example:\n# bridge (default) — containers on same host\n# Communicate by container name on CUSTOM bridge:\ndocker network create myapp-network\ndocker run --network myapp-network --name db mongo\ndocker run --network myapp-network --name app myapp\n# App → mongodb://db:27017 (name resolution!)\n\n# host — container uses host network directly\ndocker run --network host nginx\n# Port 80 on container = port 80 on host. No -p needed.\n# Highest performance, least isolation.\n\n# none — no networking\ndocker run --network none secure-batch-job\n\n# overlay — multi-host (Docker Swarm)\n# Connects containers across different servers" },
      { q: "How do you secure Docker images and containers?", a: "Use minimal base images, run as non-root, scan with Trivy, never store secrets in images.\n\n🔧 Real-time Example:\nDockerfile security:\n# 1. Minimal base image\nFROM distroless/java17-debian11  # No shell, no OS tools\n\n# 2. Non-root user\nRUN addgroup -S appgroup && adduser -S appuser -G appgroup\nUSER appuser\n\n# 3. Read-only filesystem\ndocker run --read-only --tmpfs /tmp myapp\n\n# 4. Resource limits\ndocker run --memory='512m' --cpus='1.0' myapp\n\n# 5. Trivy scan in CI/CD\ntrivy image myapp:v1.0\n# CRITICAL: 0  HIGH: 0  → safe to deploy\n\n# 6. Never:\nENV DB_PASSWORD=secret123  # ❌ secret in image layer!" },
    ]
  },
  {
    id: 'kubernetes',
    name: 'Kubernetes',
    emoji: '☸️',
    color: '#6366f1',
    questions: [
      { q: "What is a Pod?", a: "The smallest deployable unit in Kubernetes. A Pod wraps one or more containers that share the same network and storage.\n\n🔧 Real-time Example:\napiVersion: v1\nkind: Pod\nmetadata:\n  name: myapp-pod\nspec:\n  containers:\n  - name: app\n    image: myapp:v1\n    ports:\n    - containerPort: 8080\n  - name: log-shipper      # sidecar container\n    image: fluentd:latest\n    # Shares same network namespace\n    # Both talk via localhost\n\nPod gets one IP address. Both containers share that IP. Log shipper reads logs from /var/log mounted from app container." },
      { q: "What is Ingress?", a: "An API object managing external HTTP/HTTPS access to services inside the cluster. Smart reverse proxy/router.\n\n🔧 Real-time Example:\n# Without Ingress: 10 services = 10 AWS LoadBalancers = high cost!\n# With Ingress: 1 LoadBalancer → routes to all services\n\napiVersion: networking.k8s.io/v1\nkind: Ingress\nspec:\n  rules:\n  - host: api.company.com\n    http:\n      paths:\n      - path: /users\n        backend: service: name: user-service\n      - path: /orders\n        backend: service: name: order-service\n      - path: /payments\n        backend: service: name: payment-service\n\nOne ALB → routes based on path → saves $150/month for 10 microservices." },
      { q: "What is the difference between Deployment and StatefulSet?", a: "Deployment: Stateless apps (random pod names, shared storage)\nStatefulSet: Stateful apps (stable names, dedicated PVC per pod)\n\n🔧 Real-time Example:\n# Deployment — React frontend\napiVersion: apps/v1\nkind: Deployment\nspec:\n  replicas: 3\n# Pods: myapp-7d9f2-abc, myapp-7d9f2-xyz (random)\n# Any pod can serve any request\n\n# StatefulSet — MySQL\napiVersion: apps/v1\nkind: StatefulSet\nspec:\n  replicas: 3\n# Pods: mysql-0, mysql-1, mysql-2 (stable, ordered)\n# Each gets own PVC: data-mysql-0, data-mysql-1, data-mysql-2\n# mysql-0 always primary, mysql-1 + mysql-2 replicas\n# Critical for DB replication!" },
      { q: "Explain Kubernetes architecture.", a: "Control Plane: API Server, etcd, Scheduler, Controller Manager\nWorker Nodes: kubelet, kube-proxy, Container Runtime\n\n🔧 Real-time Example: kubectl apply -f deployment.yaml flow:\n1. API Server receives request → validates + authenticates\n2. Stores desired state in etcd (the cluster's database)\n3. Scheduler detects unscheduled pods → assigns to node (checks resources, taints, affinity)\n4. kubelet on assigned node sees new pod via watch → pulls image\n5. containerd starts container\n6. kube-proxy updates iptables rules for networking\n7. Pod is Running, added to Service endpoints\n\nIf etcd goes down: cluster keeps running but you can't make changes!" },
      { q: "How do you troubleshoot a pod in CrashLoopBackOff?", a: "Pod starts, crashes, restarts repeatedly. Kubernetes keeps restarting with increasing delays.\n\n🔧 Real-time Example:\n# Step 1: Get pod status\nkubectl get pods\n# payment-7d9f   0/1   CrashLoopBackOff   47   2h\n\n# Step 2: Check events\nkubectl describe pod payment-7d9f\n# Events: Back-off restarting failed container\n\n# Step 3: Previous container logs (most important!)\nkubectl logs payment-7d9f --previous\n# Error: JDBC Connection failed: Connection refused to db:5432\n\n# Step 4: Check if DB service exists\nkubectl get svc | grep db\n# No service found! DB service was never deployed.\n\n# Fix: Deploy DB service\nkubectl apply -f db-service.yaml\n# CrashLoopBackOff resolves → pod Running" },
      { q: "What are readiness and liveness probes?", a: "Liveness: Is the app alive? Fails → restart container\nReadiness: Is the app ready for traffic? Fails → remove from load balancer\n\n🔧 Real-time Example:\nlivenessProbe:\n  httpGet:\n    path: /health\n    port: 8080\n  initialDelaySeconds: 30   # wait 30s before first check\n  periodSeconds: 10         # check every 10s\n  failureThreshold: 3       # restart after 3 failures\n\nreadinessProbe:\n  httpGet:\n    path: /ready\n    port: 8080\n  initialDelaySeconds: 10   # app might start faster\n  periodSeconds: 5\n\nScenario: Spring Boot takes 45s to warm up caches.\nWithout readiness probe → K8s sends traffic immediately → 503 errors!\nWith readiness probe → pod shows NotReady until /ready returns 200 → no errors." },
      { q: "What is Blue-Green deployment in Kubernetes?", a: "Two identical deployments (blue=current, green=new). Switch traffic instantly by updating Service selector.\n\n🔧 Real-time Example:\n# Deploy green (new version)\nkubectl apply -f deployment-green.yaml\n# green pods: version=green, app=myapp\n\n# Test green environment\ncurl http://green-test-service/health\n# All good!\n\n# Switch traffic (instant, zero downtime)\nkubectl patch service myapp \\\n  -p '{\"spec\":{\"selector\":{\"version\":\"green\"}}}'\n\n# Traffic now goes to green.\n# Blue still running as instant rollback:\nkubectl patch service myapp \\\n  -p '{\"spec\":{\"selector\":{\"version\":\"blue\"}}}'\n\n# Rollback in < 1 second!" },
      { q: "What is RBAC in Kubernetes?", a: "Role-Based Access Control — controls who can do what in the cluster.\n\n🔧 Real-time Example:\n# Dev team can only view pods in 'dev' namespace\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  namespace: dev\n  name: pod-reader\nrules:\n- apiGroups: [\"\"]\n  resources: [\"pods\", \"pods/log\"]\n  verbs: [\"get\", \"list\", \"watch\"]\n  # NOT: create, delete, exec\n---\nkind: RoleBinding\napiVersion: rbac.authorization.k8s.io/v1\nmetadata:\n  name: dev-team-binding\n  namespace: dev\nroleRef:\n  kind: Role\n  name: pod-reader\nsubjects:\n- kind: Group\n  name: dev-team\n\nDev team can see logs but can't exec into pods or delete them." },
      { q: "How does Horizontal Pod Autoscaler work?", a: "Automatically scales pod replicas based on CPU/memory or custom metrics.\n\n🔧 Real-time Example:\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: myapp\n  minReplicas: 3\n  maxReplicas: 20\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 70\n\nBlack Friday scenario:\n9AM:  3 pods, CPU 40% (normal)\n10AM: Traffic spike → CPU 80%\n10:02: HPA adds 3 more pods → 6 total\n11AM: Peak → 15 pods, CPU 65%\n3PM:  Traffic drops → scales back to 3\nAll automatic! Zero manual intervention." },
      { q: "How do you perform rollback in Kubernetes?", a: "Use kubectl rollout undo command.\n\n🔧 Real-time Example:\n# Deploy v2.0 (has a bug)\nkubectl set image deployment/myapp app=myrepo/myapp:v2.0\n\n# Error rate spikes to 15%! Need to rollback.\nkubectl rollout history deployment/myapp\n# REVISION  CHANGE-CAUSE\n# 1         version=v1.0\n# 2         version=v2.0  ← current\n\n# Instant rollback to previous version\nkubectl rollout undo deployment/myapp\n\n# Or rollback to specific revision\nkubectl rollout undo deployment/myapp --to-revision=1\n\n# Watch recovery\nkubectl rollout status deployment/myapp\n# Waiting for rollout to finish: 4 of 5 updated...\n# deployment successfully rolled out\n\n# Error rate drops back to 0.1% ✓" },
      { q: "What is CrashLoopBackOff and how do you fix it?", a: "Container keeps crashing and Kubernetes keeps restarting it with increasing delays (1s, 2s, 4s, 8s...).\n\n🔧 Real-time Example:\nCommon causes and fixes:\n\n1. App exits immediately (startup error)\n   kubectl logs myapp-pod --previous\n   # 'config.yml not found'\n   Fix: Mount ConfigMap with the config file\n\n2. Missing environment variable\n   # 'DB_HOST: unbound variable'\n   Fix: Add env var to deployment spec\n\n3. OOMKilled (out of memory)\n   kubectl describe pod myapp-pod | grep -i oom\n   # Reason: OOMKilled\n   Fix: Increase memory limit in deployment\n\n4. Wrong image entrypoint\n   # 'exec: java: not found'\n   Fix: Check base image has Java installed" },
      { q: "What is the difference between ClusterIP, NodePort, and LoadBalancer?", a: "ClusterIP: Inside cluster only\nNodePort: Via node IP + port (30000-32767)\nLoadBalancer: Cloud load balancer (production)\n\n🔧 Real-time Example:\n# ClusterIP — DB should NEVER be externally accessible\napiVersion: v1\nkind: Service\nspec:\n  type: ClusterIP         # default\n  selector: {app: postgres}\n  ports: [{port: 5432}]\n\n# NodePort — quick dev testing (avoid in production)\nspec:\n  type: NodePort\n  ports:\n  - port: 80\n    nodePort: 30080       # access via NodeIP:30080\n\n# LoadBalancer — production external traffic\nspec:\n  type: LoadBalancer      # creates AWS ALB/NLB\n  ports:\n  - port: 443\n    targetPort: 8080\n\nRule: DB → ClusterIP, Internal services → ClusterIP, Ingress controller → LoadBalancer" },
      { q: "How do you debug a Pending Pod?", a: "Pending = pod cannot be scheduled on any node.\n\n🔧 Real-time Example:\nkubectl describe pod myapp-pending\n# Events: 0/3 nodes available:\n#   1 node(s) had taint {dedicated: gpu}\n#   2 Insufficient memory\n\n# Case 1: Insufficient resources\n# Pod requests 4Gi RAM, all nodes have < 4Gi free\nkubectl top nodes\n# node1: 7.5Gi/8Gi used\n# node2: 7.8Gi/8Gi used\n# Fix: Add more nodes OR reduce pod memory request\n\n# Case 2: Taint/Toleration mismatch\n# Node has taint, pod has no matching toleration\n# Fix: Add toleration to pod spec\ntolerations:\n- key: 'dedicated'\n  operator: 'Equal'\n  value: 'gpu'\n  effect: 'NoSchedule'\n\n# Case 3: PVC not bound\nkubectl get pvc\n# STATUS: Pending\n# Fix: Check StorageClass, create PV" },
      { q: "What is GitOps and how does ArgoCD implement it?", a: "GitOps: Git as single source of truth for infrastructure and deployments.\nArgoCD: Continuously syncs cluster state with Git repository.\n\n🔧 Real-time Example:\n# Developer workflow with ArgoCD:\n1. Dev makes change → commits to Git repo\n2. ArgoCD detects change (polls every 3 min or webhook)\n3. Compares Git state vs cluster state\n4. If different → marks app as OutOfSync\n5. Auto-sync → applies changes to cluster\n6. App marked Synced + Healthy\n\n# Manual change detected (drift):\nkubectl scale deployment myapp --replicas=1  # someone did this!\n# ArgoCD: OutOfSync detected!\n# Auto-sync reverts: replicas back to 3 (as per Git)\n\n# Full audit trail:\ngit log --oneline k8s/deployment.yaml\n# abc1234 Scale to 5 replicas for Black Friday\n# def5678 Deploy v2.1.0\n# Every change traceable to PR and person!" },
    ]
  },
  {
    id: 'terraform',
    name: 'Terraform',
    emoji: '🏗️',
    color: '#8b5cf6',
    questions: [
      { q: "What is Terraform and how does it work?", a: "Open-source IaC tool by HashiCorp. Reads .tf files → calls cloud provider APIs → creates resources → updates state file.\n\n🔧 Real-time Example:\n# workflow:\nterraform init    # Download AWS provider plugin\nterraform plan    # Show what will be created (dry run)\nterraform apply   # Actually create resources\nterraform destroy # Tear down all resources\n\nExample:\nresource 'aws_instance' 'web' {\n  ami           = 'ami-0c55b159cbfafe1f0'\n  instance_type = 't3.medium'\n  tags = { Name = 'web-server' }\n}\n\nterraform apply → calls AWS API → EC2 created → state file records:\n  aws_instance.web.id = 'i-0abc1234567890'" },
      { q: "What is Terraform state file?", a: "JSON file (terraform.tfstate) tracking current infrastructure state. Maps Terraform code to real-world resources.\n\n🔧 Real-time Example:\n# State file contains:\n{\n  'resources': [{\n    'type': 'aws_instance',\n    'name': 'web',\n    'instances': [{\n      'attributes': {\n        'id': 'i-0abc1234',\n        'public_ip': '54.23.12.45',\n        'instance_type': 't3.medium'\n      }\n    }]\n  }]\n}\n\nWithout state file: Terraform doesn't know i-0abc1234 already exists\n→ Would try to CREATE a new EC2!\n→ You'd have duplicate resources\n\nWith state file: Terraform knows → compares → shows CHANGE, not create" },
      { q: "What happens if Terraform state file is deleted?", a: "Terraform loses track of all managed resources. Running apply again creates DUPLICATE resources.\n\n🔧 Real-time Example:\n# State file accidentally deleted from S3\n# Your infra: 1 VPC, 3 EC2s, 1 RDS still running\n\nterraform plan\n# + aws_vpc.main will be created      ← DUPLICATE!\n# + aws_instance.web[0] will be created ← DUPLICATE!\n# + aws_instance.web[1] will be created ← DUPLICATE!\n\n# Fix: Re-import existing resources\nterraform import aws_vpc.main vpc-12345678\nterraform import 'aws_instance.web[0]' i-0abc1234\nterraform import aws_db_instance.main mydb-identifier\n\n# Prevention:\n# → Always use remote backend (S3 with versioning)\n# → S3 versioning allows restoring deleted state" },
      { q: "What is state locking and why is it important?", a: "Prevents two people from running terraform apply simultaneously, which could corrupt the state file.\n\n🔧 Real-time Example:\n# Backend config with locking:\nterraform {\n  backend 's3' {\n    bucket         = 'company-tf-state'\n    key            = 'prod/terraform.tfstate'\n    region         = 'us-east-1'\n    dynamodb_table = 'tf-lock-table'  # locking!\n  }\n}\n\n# Engineer A runs: terraform apply (starts)\n# DynamoDB: LockID = 'company-tf-state/prod/terraform.tfstate'\n\n# Engineer B runs: terraform apply\n# Error: Error acquiring the state lock!\n# Lock Info: ID=xyz, Who=engineerA, Created=14:30:00\n\n# Engineer B waits → Engineer A finishes → lock released → B can proceed\n# Prevents corruption from concurrent writes!" },
      { q: "What are Terraform modules?", a: "Reusable, self-contained packages of Terraform configurations. Like functions in programming.\n\n🔧 Real-time Example:\n# Problem: 5 microservices each need ECS service + ALB + IAM role\n# Without modules: 5x copy-paste (200+ lines each)\n\n# Create module once\nmodule structure:\n  modules/ecs-service/\n    main.tf     # ECS service + task definition\n    alb.tf      # Application Load Balancer\n    iam.tf      # IAM roles\n    variables.tf\n    outputs.tf\n\n# Use 5 times with different inputs\nmodule 'user_service' {\n  source        = './modules/ecs-service'\n  service_name  = 'user-service'\n  container_port = 8081\n  cpu           = 256\n  memory        = 512\n}\n\nmodule 'order_service' {\n  source        = './modules/ecs-service'\n  service_name  = 'order-service'\n  container_port = 8082\n  cpu           = 512\n  memory        = 1024\n}\n\n80% less code! Update module once → all services updated." },
      { q: "What is the difference between terraform plan and terraform apply?", a: "plan: Shows what Terraform WILL do (dry run — no changes made)\napply: Actually creates/modifies/destroys resources\n\n🔧 Real-time Example:\nterraform plan output:\n# + aws_instance.web will be created\n#   ami           = 'ami-0abc123'\n#   instance_type = 't3.medium'\n# ~ aws_security_group.app (update in-place)\n#   - ingress port 80 will be removed\n#   + ingress port 443 will be added\n# - aws_instance.old will be destroyed\n# Plan: 1 to add, 1 to change, 1 to destroy.\n\n# Team lead reviews plan before applying to prod!\n# Sees the destroy → asks: intentional?\n# Answer: No! Revert that change.\n# Plan saved the day.\n\n# In CI/CD:\n# PR → terraform plan → team reviews output → approve → merge → terraform apply" },
      { q: "What is terraform import?", a: "Brings existing manually-created resources under Terraform management without recreating them.\n\n🔧 Real-time Example:\n# Old RDS created manually 6 months ago\n# Now want Terraform to manage it\n\n# Step 1: Write resource block (empty config)\nresource 'aws_db_instance' 'legacy_db' {\n  # attributes filled after import\n}\n\n# Step 2: Import\nterraform import aws_db_instance.legacy_db myapp-prod-db\n# aws_db_instance.legacy_db: Import prepared!\n# aws_db_instance.legacy_db: Refreshing state...\n\n# Step 3: Fill in config from state\nterraform show  # shows all imported attributes\n\n# Step 4: Plan (should show no changes)\nterraform plan\n# No changes. Infrastructure is up-to-date.\n\n# Now Terraform manages the existing RDS!" },
      { q: "What is drift detection in Terraform?", a: "When real infrastructure differs from Terraform state (someone made manual changes).\n\n🔧 Real-time Example:\n# Someone added a security group rule manually in AWS Console\n# SG should only allow 443, but they added 22 (SSH)\n\n# Terraform detects drift on next plan:\nterraform plan\n# ~ aws_security_group.app will be updated in-place\n#   ~ ingress {\n#     - from_port = 22    ← this will be REMOVED\n#     - to_port   = 22    ← Terraform will revert it!\n#   }\n\n# Two options:\n# 1. Apply → revert manual change (enforce IaC)\n# 2. Update .tf file to include port 22 (adopt the change)\n\n# Best practice: All changes via Terraform only\n# Block manual console changes via SCP:\n# 'Require tag: managed-by=terraform' on all resources" },
      { q: "What is for_each vs count in Terraform?", a: "count: Creates N identical resources\nfor_each: Creates resources from a map/set with unique configurations\n\n🔧 Real-time Example:\n# count — 3 identical EC2s\nresource 'aws_instance' 'web' {\n  count         = 3\n  ami           = 'ami-0abc123'\n  instance_type = 't3.micro'\n  tags = { Name = 'web-${count.index}' }\n}\n\n# for_each — different configs per instance\nlocals {\n  services = {\n    web = { type = 't3.micro',  port = 80  }\n    api = { type = 't3.medium', port = 8080 }\n    db  = { type = 'r5.large',  port = 5432 }\n  }\n}\n\nresource 'aws_instance' 'service' {\n  for_each      = local.services\n  instance_type = each.value.type\n  tags = { Name = each.key }  # 'web', 'api', 'db'\n}\n\nKey difference: Delete middle item with count → Terraform recreates all after it (index shift!). with for_each → only deletes the specific item by key. Always prefer for_each for production!" },
      { q: "How do you handle sensitive variables in Terraform?", a: "Use sensitive = true, pass via environment variables, use Vault/Secrets Manager.\n\n🔧 Real-time Example:\n# Mark as sensitive\nvariable 'db_password' {\n  type      = string\n  sensitive = true  # won't appear in plan/apply output\n}\n\n# Pass via environment variable (CI/CD pipeline)\nexport TF_VAR_db_password=$(aws secretsmanager get-secret-value \\\n  --secret-id prod/db/password \\\n  --query SecretString --output text | jq -r .password)\nterraform apply\n\n# In plan output:\n# + aws_db_instance.main\n#   password = (sensitive value)  ← hidden!\n\n# Never:\nvariable 'db_password' {\n  default = 'mysecret123'  # ❌ committed to Git!\n}" },
    ]
  },
  {
    id: 'ansible',
    name: 'Ansible',
    emoji: '🤖',
    color: '#ec4899',
    questions: [
      { q: "What is Ansible and explain its architecture?", a: "Agentless automation tool for configuration management, deployment, and task automation via SSH.\n\nArchitecture:\n• Control Node: Where Ansible runs\n• Managed Nodes: Target servers (no agent needed)\n• Inventory: List of servers\n• Modules: Units of work\n• Playbooks: YAML automation scripts\n\n🔧 Real-time Example:\n# Instead of SSHing into 50 servers manually:\nansible-playbook -i inventory install_java.yml\n\n# Ansible:\n1. Reads inventory (50 server IPs)\n2. SSHes into all 50 simultaneously\n3. Runs install_java module on each\n4. Reports: 50 changed, 0 failed\n\nWhat takes 4 hours manually → 3 minutes with Ansible!" },
      { q: "What is idempotency in Ansible?", a: "Running a playbook multiple times produces the same result — no unintended side effects.\n\n🔧 Real-time Example:\n# Idempotent module:\n- name: Install Nginx\n  apt:\n    name: nginx\n    state: present     # install IF missing\n\n# Run 1 (Nginx not installed) → changed: [server1]\n# Run 2 (Nginx already installed) → ok: [server1]\n# No duplicate installation!\n\n# NOT idempotent (avoid!):\n- name: Append to config\n  shell: echo 'config setting' >> /etc/app.conf\n# Run 1: adds line → ok\n# Run 2: adds line AGAIN → duplicate!\n\n# Idempotent alternative:\n- name: Ensure config line exists\n  lineinfile:\n    path: /etc/app.conf\n    line: 'config setting'\n    create: yes\n# Only adds if not already present" },
      { q: "What is Ansible Vault?", a: "Encrypts sensitive data (passwords, API keys) stored in YAML files so they can safely be in Git.\n\n🔧 Real-time Example:\n# Create encrypted file\nansible-vault create group_vars/all/vault.yml\n\n# Contents (before encryption):\nvault_db_password: 'SuperSecret123'\nvault_api_key: 'abc123xyz'\n\n# After encryption (safe to commit to Git):\n$ANSIBLE_VAULT;1.1;AES256\n3866333865373464626538...(gibberish)\n\n# Reference in regular vars:\ndb_password: '{{ vault_db_password }}'\n\n# Run playbook:\nansible-playbook site.yml --vault-password-file ~/.vault_pass\n\n# Rekey when team member leaves:\nansible-vault rekey group_vars/all/vault.yml\n# Enter old password → enter new password\n# Ex-employee's copy is now useless!" },
      { q: "What are roles in Ansible?", a: "Reusable, structured playbook components with standard directory layout.\n\n🔧 Real-time Example:\nroles/\n  java/\n    tasks/main.yml       # Install Java\n    defaults/main.yml    # java_version: '17'\n    handlers/main.yml    # restart service\n  nginx/\n    tasks/main.yml       # Install + configure\n    templates/nginx.conf.j2  # Jinja2 template\n  mysql/\n    tasks/main.yml\n    vars/main.yml        # DB settings\n\n# site.yml — clean and reusable\n- hosts: appservers\n  roles:\n    - java\n    - nginx\n    - mysql\n\n# 5 teams all need Java?\n# requirements.yml:\nroles:\n  - src: git+https://github.com/company/ansible-roles.git\n    name: java\n\nansible-galaxy install -r requirements.yml\n# All teams use same tested role!" },
      { q: "How do you integrate Ansible with Jenkins?", a: "Jenkins runs ansible-playbook command as a pipeline step after build/test stages.\n\n🔧 Real-time Example:\nstage('Deploy via Ansible') {\n  steps {\n    withCredentials([\n      file(credentialsId: 'vault-pass', variable: 'VAULT_FILE'),\n      sshUserPrivateKey(credentialsId: 'ssh-key', keyFileVariable: 'SSH_KEY')\n    ]) {\n      sh '''\n        ansible-playbook \\\n          -i inventory/production \\\n          --vault-password-file ${VAULT_FILE} \\\n          --private-key ${SSH_KEY} \\\n          -e \"app_version=${BUILD_NUMBER}\" \\\n          deploy.yml\n      '''\n    }\n  }\n}\n\nJenkins builds JAR → Ansible deploys to 20 servers simultaneously.\nEach server: stops old app → copies new JAR → starts new app → verifies health." },
      { q: "Write a playbook to install multiple services.", a: "Complete playbook for Java + Nginx + Docker installation:\n\n🔧 Real-time Example:\n---\n- name: Configure Application Stack\n  hosts: appservers\n  become: yes\n\n  tasks:\n    # Java\n    - name: Install Java 17\n      apt:\n        name: openjdk-17-jdk\n        state: present\n        update_cache: yes\n\n    # Nginx\n    - name: Install Nginx\n      apt:\n        name: nginx\n        state: present\n    - name: Start Nginx\n      service:\n        name: nginx\n        state: started\n        enabled: yes\n\n    # Docker\n    - name: Install Docker\n      apt:\n        name: docker-ce\n        state: present\n    - name: Start Docker\n      service:\n        name: docker\n        state: started\n        enabled: yes\n    - name: Add user to docker group\n      user:\n        name: appuser\n        groups: docker\n        append: yes\n\n  handlers:\n    - name: Restart Nginx\n      service: name=nginx state=restarted\n\nRun on 20 servers: ansible-playbook -i inventory stack.yml\nAll 20 servers configured in ~5 minutes!" },
    ]
  },
  {
    id: 'monitoring',
    name: 'Monitoring',
    emoji: '📊',
    color: '#14b8a6',
    questions: [
      { q: "What is Prometheus and how does it work?", a: "Open-source monitoring toolkit. Pulls (scrapes) metrics from targets at regular intervals, stores as time-series data.\n\n🔧 Real-time Example:\n# prometheus.yml scrape config\nscrape_configs:\n  - job_name: 'spring-apps'\n    metrics_path: '/actuator/prometheus'\n    scrape_interval: 15s\n    static_configs:\n      - targets: ['app1:8080', 'app2:8080']\n\n# Metrics scraped every 15s from /actuator/prometheus:\nhttp_requests_total{method='POST',status='200'} 1234\njvm_memory_used_bytes{area='heap'} 256000000\ndb_query_duration_seconds{query='findUser'} 0.045\n\n# PromQL query:\nrate(http_requests_total[5m])  # requests per second\nhistogram_quantile(0.99, request_duration_seconds_bucket)  # p99 latency" },
      { q: "What is Grafana and how do you configure it?", a: "Open-source visualization platform. Connects to Prometheus, CloudWatch, Elasticsearch and displays dashboards.\n\n🔧 Real-time Example:\n# Quick setup with Docker Compose:\nservices:\n  prometheus:\n    image: prom/prometheus\n    volumes:\n      - ./prometheus.yml:/etc/prometheus/prometheus.yml\n  grafana:\n    image: grafana/grafana\n    ports:\n      - '3000:3000'\n    environment:\n      - GF_SECURITY_ADMIN_PASSWORD=admin\n    depends_on:\n      - prometheus\n\n# In Grafana UI:\n1. Configuration → Data Sources → Add Prometheus\n2. URL: http://prometheus:9090\n3. Save & Test\n4. Import dashboard ID 1860 (Node Exporter Full)\n\n# Instant server monitoring dashboard with:\n# CPU, Memory, Disk, Network, Load average — all in real-time graphs" },
      { q: "What is Observability? What are logs, metrics, and traces?", a: "Three pillars to understand system behavior from the outside:\n\n🔧 Real-time Example: Payment service slow...\n\nMETRICS (Prometheus):\np99_latency = 4.2s → tells you IT IS slow\n\nTRACES (Jaeger):\nRequest flow:\n  API Gateway   10ms ✓\n  Order Service 15ms ✓\n  Inventory Service 3800ms ← BOTTLENECK!\n  DB query      3750ms\nTells you WHERE it's slow\n\nLOGS (ELK Stack):\n'Cache miss — falling back to DB query'\n'Select * from inventory where product_id=? took 3750ms'\nTells you WHY it's slow\n\nFix: Warm up inventory cache on startup.\nWithout all 3 pillars: would take hours to find this.\nWith full observability: found in 3 minutes." },
      { q: "How do you configure Prometheus alerts?", a: "Define rules in alert_rules.yml, route via AlertManager to Slack/PagerDuty.\n\n🔧 Real-time Example:\n# alert_rules.yml\ngroups:\n  - name: production_alerts\n    rules:\n      - alert: ServiceDown\n        expr: up == 0\n        for: 1m\n        labels:\n          severity: critical\n        annotations:\n          summary: 'Service {{ $labels.job }} is DOWN'\n\n      - alert: HighErrorRate\n        expr: rate(http_errors_total[5m]) > 0.05\n        for: 2m\n        labels:\n          severity: warning\n        annotations:\n          description: 'Error rate {{ $value | humanizePercentage }}'\n\n# alertmanager.yml routing:\nroute:\n  routes:\n    - match: {severity: critical}\n      receiver: pagerduty        # wake someone up!\n    - match: {severity: warning}\n      receiver: slack-channel    # just notify\n\ninhibit_rules:  # suppress warning if critical fires\n  - source_match: {severity: critical}\n    target_match: {severity: warning}\n    equal: ['service']" },
      { q: "Service down at 2AM — what do you do?", a: "Structured incident response:\n\n🔧 Real-time Example:\nT+0:00 PagerDuty alert → acknowledge\nT+0:02 Join incident Slack channel\n        Post: 'Investigating payment service outage'\n\nT+0:03 ASSESS\n        kubectl get pods -n production\n        # payment-7d9f   0/1   CrashLoopBackOff\n\nT+0:05 IDENTIFY\n        kubectl logs payment-7d9f --previous\n        # 'Redis connection timeout after 30s'\n        kubectl get pods | grep redis\n        # redis-0   0/1   OOMKilled\n\nT+0:07 MITIGATE\n        kubectl set resources deployment/redis --limits=memory=1Gi\n        kubectl rollout restart deployment/redis\n\nT+0:10 VERIFY\n        watch kubectl get pods\n        # redis-0   1/1   Running ✓\n        # payment   1/1   Running ✓\n        # Error rate: 0% ✓\n\nT+0:12 COMMUNICATE\n        'Service restored at 02:12 UTC'\n        Update status page\n\nT+24:00 POST-MORTEM\n        Root cause: Redis memory limit too low (256Mi)\n        Fix: Increase to 1Gi + add memory alert at 80%" },
    ]
  },
  {
    id: 'git',
    name: 'Git',
    emoji: '🌍',
    color: '#f97316',
    questions: [
      { q: "What is the difference between git merge and git rebase?", a: "merge: Preserves all commits + creates merge commit (non-linear history)\nrebase: Replays commits on top of target (linear, clean history)\n\n🔧 Real-time Example:\n# Merge — safe for shared branches\ngit checkout main\ngit merge feature/payment\n# History: A → B → C → M (merge commit)\n#                    ↗\n#               D → E (feature)\n\n# Rebase — clean history for feature branches\ngit checkout feature/payment\ngit rebase main\n# History: A → B → C → D' → E' (linear!)\n# Looks like feature was developed on latest code\n\n# Team rule:\n# Rebase locally before PR (clean history)\n# Merge via PR to main (preserve branch history)\n# NEVER rebase shared/remote branches!" },
      { q: "What is git stash and when do you use it?", a: "Temporarily saves uncommitted changes so you can switch context without committing incomplete work.\n\n🔧 Real-time Example:\n# Working on payment feature, halfway done...\n# URGENT: production bug needs immediate fix!\n\n# Save incomplete work\ngit stash save 'WIP: payment gateway integration'\n\n# Fix the bug\ngit checkout main\ngit checkout -b hotfix/login-crash\n# fix code\ngit commit -m 'fix: resolve login null pointer'\ngit push → merge → deploy\n\n# Come back to your feature\ngit checkout feature/payment\ngit stash pop  # restore exactly where you left off!\n\n# List all stashes\ngit stash list\n# stash@{0}: WIP: payment gateway integration\n# stash@{1}: WIP: dashboard charts" },
      { q: "What is git cherry-pick?", a: "Apply a specific commit from one branch to another without merging the entire branch.\n\n🔧 Real-time Example:\n# Security fix committed to develop branch\ngit log develop --oneline\n# abc1234 Fix SQL injection in login   ← need this in prod!\n# def5678 New dashboard feature         ← not ready\n# ghi9012 Refactor payment module       ← not ready\n\n# Cherry-pick ONLY the security fix to release branch\ngit checkout release/v2.0\ngit cherry-pick abc1234\n\n# ✓ Security fix is now in production branch\n# ✗ Unfinished features NOT included\n\n# Multiple commits:\ngit cherry-pick abc1234 def5678  # multiple\ngit cherry-pick abc1234..def5678 # range\n\n# If conflict during cherry-pick:\ngit cherry-pick --continue  # after resolving\ngit cherry-pick --abort     # cancel" },
      { q: "What branching strategy do you follow?", a: "GitFlow for complex projects, GitHub Flow for simpler ones.\n\n🔧 Real-time Example: GitFlow in practice:\n# Branches:\nmain     → production (tagged releases)\ndevelop  → integration (all features merged here)\nfeature/JIRA-123-user-auth  → new features\nrelease/v2.1.0              → release prep\nhotfix/JIRA-456-login-crash → emergency fixes\n\n# Feature workflow:\ngit checkout develop\ngit checkout -b feature/JIRA-123-user-auth\n# ... develop feature ...\ngit push origin feature/JIRA-123-user-auth\n# Create PR: feature → develop\n# Code review → approve → merge\n\n# Release workflow:\ngit checkout -b release/v2.1.0 develop\n# Only bug fixes on release branch\ngit checkout main && git merge release/v2.1.0\ngit tag v2.1.0\ngit checkout develop && git merge release/v2.1.0" },
      { q: "How do you resolve merge conflicts?", a: "Identify conflicting files → edit to choose correct version → stage and commit.\n\n🔧 Real-time Example:\ngit merge feature/user-auth\n# CONFLICT: Merge conflict in UserService.java\n\n# Conflict markers in file:\n<<<<<<< HEAD (your branch - current)\npassword = BCryptEncoder.hash(password);\n=======\npassword = SHA256.hash(password);  // insecure!\n>>>>>>> feature/user-auth (incoming)\n\n# Edit file — keep the secure version:\npassword = BCryptEncoder.hash(password);\n# (remove all <<<, ===, >>> markers)\n\n# Mark as resolved\ngit add src/UserService.java\ngit commit -m 'Merge: keep BCrypt for password hashing'\n\n# Pro tip: Use VS Code merge tool\n# Shows: Accept Current | Accept Incoming | Accept Both\n# Visual, fast, safe" },
      { q: "What is the difference between git pull and git fetch?", a: "fetch: Downloads changes from remote (doesn't touch local branch)\npull: fetch + merge into current branch automatically\n\n🔧 Real-time Example:\n# fetch — see what changed before integrating\ngit fetch origin\ngit log HEAD..origin/main --oneline\n# abc1234 Add payment retry logic (teammate's commit)\n# def5678 Fix DB connection pool\n\ngit diff HEAD origin/main  # review the changes\n# Looks safe → merge\ngit merge origin/main\n\n# pull — quick sync (fetch + merge in one step)\ngit pull origin main\n# Convenient but can create unexpected merge commits\n\n# Best practice:\n# Use fetch + rebase to keep linear history:\ngit fetch origin\ngit rebase origin/main\n# No merge commits, cleaner history" },
      { q: "How do you configure webhooks to trigger Jenkins from Git?", a: "GitHub sends HTTP POST to Jenkins when push/PR events occur.\n\n🔧 Real-time Example:\nSetup Steps:\n\n1. In GitHub:\n   Repo → Settings → Webhooks → Add webhook\n   Payload URL: http://jenkins.company.com/github-webhook/\n   Content type: application/json\n   Events: ✅ Push  ✅ Pull requests\n   Secret: (optional security token)\n\n2. In Jenkins Job:\n   Build Triggers → ✅ GitHub hook trigger for GITScm polling\n\n3. Verify:\n   git push origin main\n   # GitHub sends POST to Jenkins webhook URL\n   # Jenkins receives → triggers build in < 1 second\n   # GitHub PR shows ✅ or ❌ status check\n\nTroubleshooting webhooks:\n   GitHub → Settings → Webhooks → Recent Deliveries\n   → See each delivery + response code\n   200 = success, 4xx = Jenkins issue" },
      { q: "What is git revert and when to use it vs reset?", a: "revert: Safe undo — creates new commit undoing changes (safe for shared branches)\nreset: Rewrites history (DANGEROUS on shared branches)\n\n🔧 Real-time Example:\n# Bad code merged to main (shared branch)\ngit log --oneline\n# abc1234 Deploy broken payment feature  ← this broke prod!\n# def5678 Previous stable version\n\n# CORRECT: git revert (safe, preserves history)\ngit revert abc1234\n# Creates: 'Revert: Deploy broken payment feature'\n# History: ...def5678 → abc1234 → xyz9876 (revert commit)\n# Original commit preserved, new commit undoes it\ngit push origin main  # safe to push!\n\n# WRONG: git reset (rewrites history, breaks teammates)\ngit reset --hard def5678\ngit push --force origin main  # ❌ NEVER on shared branch!\n# Teammates' histories now diverged — chaos!\n\nRule: Shared branches → revert | Local branches → reset is ok" },
    ]
  },
  {
    id: 'aws',
    name: 'AWS',
    emoji: '☁️',
    color: '#f59e0b',
    questions: [
      { q: "What is the difference between IAM user and IAM role?", a: "IAM User: Long-term identity for humans with permanent credentials\nIAM Role: Temporary identity assumed by services (EC2, Lambda, cross-account)\n\n🔧 Real-time Example:\n# WRONG: Give EC2 access key to access S3\nexport AWS_ACCESS_KEY_ID=AKIA...   # ❌ long-term creds on server\nexport AWS_SECRET_ACCESS_KEY=xxx   # ❌ if server compromised → keys stolen\n\n# CORRECT: Attach IAM Role to EC2\n1. Create IAM Role 'EC2-S3-Access'\n2. Attach policy: s3:GetObject, s3:PutObject on my-bucket\n3. Attach role to EC2 instance\n4. EC2 automatically gets temp credentials (rotated every 1 hour)\n\n# On EC2 — no credentials needed!\naws s3 ls s3://my-bucket  # Just works!\npython s3 = boto3.client('s3')  # Auto-uses instance role\n\nRole credentials expire → auto-rotated → even if stolen, useless in 1 hour!" },
      { q: "What is a VPC and its core components?", a: "Virtual Private Cloud — your isolated network within AWS.\n\n🔧 Real-time Example: Production VPC design:\nVPC: 10.0.0.0/16 (65,536 IPs)\n\nPublic Subnets (with IGW route):\n  10.0.1.0/24 AZ-a — ALB, NAT Gateway, Bastion\n  10.0.2.0/24 AZ-b — ALB, NAT Gateway\n\nPrivate App Subnets (route via NAT):\n  10.0.3.0/24 AZ-a — EC2/EKS nodes\n  10.0.4.0/24 AZ-b — EC2/EKS nodes\n\nPrivate DB Subnets (no internet):\n  10.0.5.0/24 AZ-a — RDS primary\n  10.0.6.0/24 AZ-b — RDS standby\n\nComponents:\n• Internet Gateway → bidirectional internet for public resources\n• NAT Gateway → outbound-only internet for private resources\n• Route Tables → define traffic paths\n• Security Groups → instance-level stateful firewall\n• NACLs → subnet-level stateless firewall" },
      { q: "What is the difference between Security Groups and NACLs?", a: "Security Group: Instance-level, stateful (return traffic auto-allowed), Allow rules only\nNACL: Subnet-level, stateless (return traffic needs explicit rule), Allow + Deny rules\n\n🔧 Real-time Example:\nScenario: Block a malicious IP 192.168.1.100 attacking your servers.\n\n# NACL (subnet-level — blocks ALL instances in subnet)\nAdd DENY rule for 192.168.1.100 BEFORE allow rules\nRule 90: DENY 192.168.1.100/32 all traffic  ← lower number = higher priority\nRule 100: ALLOW 0.0.0.0/0 port 443\nOne rule blocks attacker from entire subnet instantly.\n\n# Security Group (instance-level — fine-grained)\n# Used for: allow app servers to talk to DB\nDB Security Group inbound:\n  Allow port 5432 FROM app-security-group  ← only app servers\n  Deny everything else (implicit)\n\nUse BOTH: NACL for broad protection, SG for granular control." },
      { q: "What is the difference between ALB and NLB?", a: "ALB: Layer 7 (HTTP/HTTPS), path/host routing, microservices\nNLB: Layer 4 (TCP/UDP), ultra-low latency, static IP\n\n🔧 Real-time Example:\n# ALB — e-commerce microservices\napi.company.com/users    → user-service (port 8081)\napi.company.com/orders   → order-service (port 8082)\napi.company.com/payments → payment-service (port 8083)\napi.company.com/static   → S3 bucket\n\nOne ALB handles all routing based on URL path.\nPath-based routing = cost efficient (1 ALB vs 4 LBs)\n\n# NLB — real-time gaming server\n# Needs: sub-millisecond latency, static IP for client whitelisting\n# NLB passes TCP packets without inspection\n# No header modification, preserves source IP\n# 10x lower latency than ALB for TCP workloads" },
      { q: "What is NAT Gateway and where does it reside?", a: "Allows private subnet instances to access internet (outbound only). Resides in PUBLIC subnet.\n\n🔧 Real-time Example:\nPrivate EC2 (10.0.3.10) needs to:\n→ Download Java updates (yum install java)\n→ Pull Docker images from DockerHub\n→ Call external payment API\n\nTraffic flow:\nPrivate EC2 → Route table: 0.0.0.0/0 → nat-gateway-id\nNAT Gateway (in public subnet, has Elastic IP)\n→ Route table: 0.0.0.0/0 → igw-id\nInternet Gateway → Internet\n\n# Internet can NOT initiate connection back to private EC2\n# One-way outbound only = security!\n# EC2 source IP to internet = NAT Gateway's Elastic IP\n\nHA setup: NAT Gateway per AZ\n# If single NAT GW fails → entire private subnet loses internet\n# Cost vs HA tradeoff: $0.045/hr per NAT GW" },
      { q: "What is Auto Scaling and how does it work with ALB?", a: "Auto Scaling adjusts EC2 count based on demand. ALB routes traffic to all healthy instances.\n\n🔧 Real-time Example:\nASG Configuration:\n  Min: 2  Desired: 3  Max: 10\n\nScaling Policy (Target Tracking):\n  Target CPU utilization: 70%\n\nBlack Friday scenario:\n09:00  3 instances, CPU 40%\n10:00  Flash sale starts! CPU → 85%\n10:02  ASG launches 2 more instances\n        ALB detects new instances via health check\n        ALB automatically starts routing to new instances\n10:05  6 instances running, CPU 55%\n12:00  Sale ends, CPU drops to 20%\n12:10  ASG scales in (terminates extra instances)\n        ALB drains connections (60s) before terminating\n12:15  Back to 3 instances\n\nAll automatic! Zero manual intervention. Pay only for instances running." },
